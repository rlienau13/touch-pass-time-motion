<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Touch Pass — EPVC Time &amp; Motion Study</title>
<script>

  if(lock || params.get("view")==="1"){ document.documentElement.classList.add("view-only"); }
  if(lock){ document.documentElement.classList.add("view-locked"); }

</script>
<style>
  :root{
    color-scheme: light;
    --ink:#1c1c1c;
    --muted:#6b6b6b;
    --faint:#9a9a95;
    --line:#e4e4e4;
    --paper:#fbfbfa;
    --card:#ffffff;
    --teal:#1f9e8a;
    --orange:#d97a1f;
    --purple:#6452c9;
    --rose:#b5556f;
    --blue:#2563b0;
    --slate:#64748b;
    --cyan:#0891b2;
    --gold:#b8860b;
    --good:#1f9e6b;
    --warn-bg:#fff8e6;
    --proj-line:#d6bf85;
    --proj-bg:#fffcf3;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;}
  .container{max-width:1400px; margin:0 auto; padding:30px 32px 70px;}

  h1{font-size:25px; font-weight:800; margin:0; letter-spacing:-.01em;}
  h2{font-size:19px; font-weight:800; margin:40px 0 12px; padding-bottom:4px;}
  .panel > h2:first-child, .panel > .sec-head:first-child h2{margin-top:0;}
  h3{font-size:14.5px; font-weight:800; margin:0 0 4px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  h4{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:16px 0 8px;}
  .subtitle{font-size:13px; color:var(--muted); margin:-6px 0 18px; line-height:1.5;}
  p{line-height:1.6; font-size:14px;}
  .muted{color:var(--muted);}
  .small{font-size:11.5px;}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block; flex-shrink:0;}

  .btn{font-family:inherit; font-size:12.5px; font-weight:700; padding:8px 14px; border-radius:6px; border:1px solid var(--ink); background:#fff; color:var(--ink); cursor:pointer; white-space:nowrap;}
  .btn:hover{background:var(--ink); color:#fff;}
  .btn.primary{background:var(--ink); color:#fff;}
  .btn.primary:hover{background:#000;}
  .btn.subtle{font-size:12px; padding:6px 12px; border-color:var(--line); color:var(--muted); font-weight:600;}
  .btn.subtle:hover{background:var(--line); color:var(--ink); border-color:var(--line);}
  .btn.danger-ish:hover{background:var(--rose); border-color:var(--rose); color:#fff;}
  .btn:disabled{opacity:.45; cursor:default;}
  .btn-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}

  /* Toolbar (same pattern as Roadmap / BOM) */
  .toolbar{display:flex; align-items:center; justify-content:flex-end; gap:10px; margin-bottom:22px; flex-wrap:wrap;}
  .family{display:flex; align-items:center; gap:4px; font-size:11.5px; color:var(--muted); margin-right:14px;}
  .family .fam-label{font-weight:800; text-transform:uppercase; letter-spacing:.05em; font-size:10.5px; margin-right:4px;}
  .family a, .family span.cur{padding:4px 9px; border-radius:999px; text-decoration:none; color:var(--muted); font-weight:600; border:1px solid transparent;}
  .family a:hover{border-color:var(--line); color:var(--ink);}
  .family span.cur{background:var(--ink); color:#fff;}
  .save-status{font-size:11px; color:var(--muted); margin-right:auto; display:flex; align-items:center; gap:6px;}
  .save-status .pending{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--orange);}
  .save-status .clean{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--good);}

  .doc-head{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap;}
  .eyebrow{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:6px;}
  .doc-sub{font-size:13px; color:var(--muted); margin-top:6px;}
  .legend-tags{display:flex; gap:12px; flex-wrap:wrap; font-size:11px; color:var(--muted); align-items:center;}

  /* Tabs */
  .tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin:22px 0 26px; overflow-x:auto;}
  .tabs button{font-family:inherit; font-size:12.5px; font-weight:700; color:var(--muted); background:none; border:none; padding:10px 14px; border-bottom:2px solid transparent; margin-bottom:-1px; cursor:pointer; white-space:nowrap;}
  .tabs button:hover{color:var(--ink);}
  .tabs button.active{color:var(--ink); border-bottom-color:var(--ink);}
  .tabs .count{font-size:10px; font-weight:800; background:var(--line); color:var(--muted); border-radius:999px; padding:1px 6px; margin-left:4px;}

  /* Data-type tags: measured vs calculated vs projection */
  .tag{display:inline-block; font-size:9.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; padding:2px 7px; border-radius:999px; vertical-align:1px; white-space:nowrap; line-height:1.4;}
  .t-meas{background:var(--ink); color:#fff; border:1px solid var(--ink);}
  .t-calc{border:1px solid var(--ink); color:var(--ink); background:#fff;}
  .t-proj{border:1px dashed var(--gold); color:#7d5c06; background:var(--proj-bg);}
  .t-warn{border:1px solid #e6c46a; color:#7d5c06; background:var(--warn-bg);}
  .t-good{border:1px solid var(--good); color:#0f6b47; background:#effaf5;}
  .t-out{border:1px solid var(--blue); color:var(--blue); background:#f2f6fc;}

  /* Cards */
  .card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px;}
  .card.proj{border:1.5px dashed var(--proj-line); background:repeating-linear-gradient(135deg,#fff 0,#fff 10px,var(--proj-bg) 10px,var(--proj-bg) 20px);}
  .card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:10px;}
  .card-note{font-size:11.5px; color:var(--muted); line-height:1.5; margin:2px 0 10px;}
  .grid2{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:16px;}
  .grid3{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:16px;}
  .span2{grid-column:span 2;}
  @media (max-width:1050px){ .grid2, .grid3{grid-template-columns:1fr;} .span2{grid-column:auto;} }

  /* KPI cards (BOM summary-card style) */
  .summary-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:12px;}
  .summary-card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; min-width:0;}
  .summary-card .tier-label{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:8px; display:flex; gap:6px; align-items:center; justify-content:space-between;}
  .summary-card .tier-total{font-size:21px; font-weight:800; line-height:1.15; overflow-wrap:anywhere;}
  .summary-card .tier-total.txt{font-size:16px;}
  .summary-card .tier-total-unit{font-size:11px; font-weight:700; color:var(--muted);}
  .summary-card .tier-per{font-size:11.5px; color:var(--muted); margin-top:5px; line-height:1.4;}
  .summary-card.grand-total-card{background:var(--ink); border-color:var(--ink);}
  .summary-card.grand-total-card .tier-label, .summary-card.grand-total-card .tier-total, .summary-card.grand-total-card .tier-per{color:#fff;}
  .summary-card.grand-total-card .tier-total-unit{color:rgba(255,255,255,.75);}
  .summary-card.grand-total-card .t-calc{background:transparent; color:#fff; border-color:rgba(255,255,255,.6);}
  .summary-card.wide{grid-column:span 2;}
  .summary-card .warnline{color:#8a6508;}
  .kpi-group-label{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:18px 0 8px;}

  .status-strip{display:flex; gap:10px; flex-wrap:wrap; align-items:center; font-size:12px; color:var(--muted); margin-bottom:16px;}
  .status-strip b{color:var(--ink);}
  .notice{border:1px solid #ecd9a6; background:var(--warn-bg); color:#5e4708; border-radius:8px; padding:10px 14px; font-size:12.5px; line-height:1.5; margin:0 0 14px;}
  .notice.info{border-color:var(--line); background:#fff; color:var(--ink);}
  .notice ul{margin:4px 0 0; padding-left:18px;}
  .notice .btn{margin-left:8px;}
  .empty{border:1.5px dashed var(--line); border-radius:10px; padding:28px; text-align:center; color:var(--muted); font-size:13px; background:#fff;}
  .empty b{color:var(--ink); display:block; font-size:14.5px; margin-bottom:6px;}
  .empty .btn{margin-top:12px;}

  /* Legend */
  .legend{display:flex; gap:14px; flex-wrap:wrap; margin:8px 0 2px; font-size:11.5px; color:var(--muted);}
  .legend .sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
  .sw.hatch{background:repeating-linear-gradient(135deg,#cfcfca 0,#cfcfca 2px,#fff 2px,#fff 5px) !important; border:1px solid #cfcfca;}

  /* Tables */
  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:8px; background:#fff;}
  table.grid{border-collapse:separate; border-spacing:0; font-size:12px; width:100%;}
  table.grid th, table.grid td{padding:5px 7px; border-bottom:1px solid var(--line); vertical-align:middle; text-align:left;}
  table.grid thead th{background:#f6f6f5; font-size:10.3px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); font-weight:800; border-bottom:2px solid var(--ink); white-space:nowrap; position:sticky; top:0; z-index:2;}
  table.grid thead th.sortable{cursor:pointer; user-select:none;}
  table.grid thead th.sortable:hover{color:var(--ink);}
  table.grid thead th .unit{font-weight:600; text-transform:none; letter-spacing:0; color:var(--faint);}
  table.grid thead th.calc-h{background:#f0f0ee;}
  table.grid.wrap-h thead th{white-space:normal; line-height:1.25; vertical-align:bottom;}
  .form-grid .f label.check{display:flex; text-transform:none; letter-spacing:0; font-size:11.5px; font-weight:600; color:var(--ink); margin:0 0 6px;}
  table.grid tbody tr:hover td{background:#fafafa;}
  table.grid td.num, table.grid th.num{text-align:right; font-variant-numeric:tabular-nums;}
  table.grid td.calc{background:#fafaf9; font-weight:700; font-variant-numeric:tabular-nums; text-align:right;}
  table.grid td.strong{font-weight:700;}
  table.grid td.wrap{white-space:normal; overflow-wrap:anywhere;}
  table.grid td.notes{color:var(--muted); font-size:11.5px;}
  table.grid tr.grp td{background:#f3f3f1; font-weight:800; font-size:11.5px; border-top:1.5px solid #cfcfca;}
  table.grid tr.grp td .muted{font-weight:600;}
  table.grid tr.totals-row td{border-top:2px solid var(--ink); font-weight:800; background:#fafaf9; font-variant-numeric:tabular-nums;}
  table.grid tr.totals-row td.label-cell{text-align:right; color:var(--muted); text-transform:uppercase; font-size:10.3px; letter-spacing:.03em;}
  table.grid tr.incomplete td:first-child{box-shadow:inset 3px 0 0 #e6c46a;}
  table.grid td.actions, table.grid th.actions{white-space:nowrap; text-align:right; width:1%;}
  table.grid td.idx{color:var(--faint); font-size:10.5px; text-align:right; width:1%;}
  .badge{display:inline-block; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; padding:3px 8px; border-radius:999px; color:#fff; white-space:nowrap;}
  .opcode{font-size:10.5px; font-weight:800; color:var(--muted); font-variant-numeric:tabular-nums;}

  /* Inline-editable cells */
  .ci{width:100%; min-width:0; font-family:inherit; font-size:12px; color:var(--ink); background:transparent; border:1px solid transparent; border-radius:4px; padding:4px 5px; line-height:1.3;}
  .ci:hover{border-color:var(--line); background:#fff;}
  .ci:focus{outline:none; border-color:var(--ink); background:#fff; box-shadow:0 0 0 2px rgba(28,28,28,.08);}
  .ci.num{text-align:right; font-variant-numeric:tabular-nums;}
  .ci.bad{border-color:var(--rose); background:#fdf2f4;}
  select.ci{cursor:pointer; padding-right:2px;}
  textarea.ci{resize:vertical; min-height:34px; display:block;}
  .ci.strong{font-weight:700;}
  .ci::placeholder{color:#c4c4c0;}
  .ro{display:block; padding:4px 5px; font-size:12px; overflow-wrap:anywhere; white-space:pre-wrap;}
  .ro.num{text-align:right; font-variant-numeric:tabular-nums;}
  .blank{color:#c4c4c0;}

  .icon-btn{border:none; background:none; cursor:pointer; font-size:13px; padding:3px 5px; border-radius:4px; color:var(--muted); line-height:1;}
  .icon-btn:hover{background:var(--line); color:var(--ink);}
  .icon-btn:disabled{opacity:.3; cursor:default; background:none;}

  .add-row{margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .filters{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:0 0 10px;}
  .filters label{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);}
  .filters input, .filters select, .fld{font-family:inherit; font-size:12.5px; padding:6px 9px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink);}
  .filters .spacer{flex:1;}
  .seg{display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:#fff;}
  .seg button{font-family:inherit; font-size:11.5px; font-weight:700; border:none; background:#fff; color:var(--muted); padding:6px 10px; cursor:pointer; border-right:1px solid var(--line);}
  .seg button:last-child{border-right:none;}
  .seg button.on{background:var(--ink); color:#fff;}

  details.defs{background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin-bottom:14px;}
  details.defs summary{cursor:pointer; font-size:12.5px; font-weight:800;}
  .defs-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px 22px; margin-top:12px; font-size:12px; line-height:1.5;}
  .defs-grid b{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.04em;}
  .defs-grid .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;}
  @media (max-width:1050px){ .defs-grid{grid-template-columns:1fr;} }

  /* Charts */
  .chart{width:100%; min-height:40px;}
  .chart svg{display:block; width:100%; height:auto; overflow:visible;}
  .chart text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;}
  .chart .lbl{font-size:11.5px; fill:var(--ink);}
  .chart .lbl.sub{fill:var(--muted); font-size:10px;}
  .chart .val{font-size:11px; fill:var(--muted); font-variant-numeric:tabular-nums;}
  .chart .val.strong{fill:var(--ink); font-weight:700;}
  .chart .axis{font-size:10px; fill:var(--faint); font-variant-numeric:tabular-nums;}
  .chart .gridline{stroke:#efefed; stroke-width:1;}
  .chart .baseline{stroke:#cfcfca; stroke-width:1;}
  .chart .hit{cursor:default;}
  .chart .hit:hover .mark{filter:brightness(1.1);}
  .chart .hit:hover .rowbg{fill:#f6f6f5;}
  .chart-empty{font-size:12px; color:var(--muted); padding:20px 0; text-align:center;}

  /* Small-multiple bar table */
  .mbar-table{width:100%; border-collapse:collapse; font-size:11.5px;}
  .mbar-table th{font-size:10px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); font-weight:800; text-align:left; padding:4px 6px; border-bottom:2px solid var(--ink);}
  .mbar-table td{padding:5px 6px; border-bottom:1px solid var(--line); vertical-align:middle;}
  .mbar-table td.oplbl{font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:170px;}
  .mbar{display:flex; align-items:center; gap:6px;}
  .mbar .track{flex:1; height:12px; display:flex; gap:2px; min-width:0;}
  .mbar .seg-b{height:12px; border-radius:0;}
  .mbar .seg-b:last-child{border-radius:0 4px 4px 0;}
  .mbar .v{font-size:10.5px; color:var(--muted); min-width:44px; text-align:right; font-variant-numeric:tabular-nums;}

  /* Process flow */
  .flow{display:flex; flex-wrap:wrap; gap:14px 0; align-items:stretch;}
  .flow-stage{display:flex; flex-direction:column; padding:0 4px;}
  .flow-stage-label{font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:#fff; padding:4px 8px; border-radius:3px; margin-bottom:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .flow-nodes{display:flex; align-items:stretch; flex:1;}
  .flow-node{position:relative; width:142px; background:#fff; border:1px solid var(--line); border-left:4px solid; border-radius:6px; padding:8px 9px; font-size:11.5px; margin-right:22px;}
  .flow-node::after{content:"→"; position:absolute; right:-18px; top:50%; transform:translateY(-50%); color:var(--faint); font-size:13px;}
  .flow-stage:last-child .flow-node:last-child::after{content:"";}
  .flow-node .nm{font-weight:700; line-height:1.25; margin:2px 0 6px;}
  .flow-node .mt{font-size:10.5px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .flow-node.out{border-style:dashed; border-left-style:solid; background:#f8fafd;}
  .flow-node.bneck{box-shadow:0 0 0 2px var(--gold);}
  .flow-node .star{color:var(--gold); font-size:13px; position:absolute; top:4px; right:6px;}

  /* Stages editor */
  .stage-list{display:flex; flex-direction:column; gap:6px;}
  .stage-row{display:flex; gap:6px; align-items:center;}
  .stage-row .ci{font-weight:700;}
  .swatches{display:flex; gap:3px;}
  .swatch{width:16px; height:16px; border-radius:4px; border:2px solid #fff; box-shadow:0 0 0 1px var(--line); cursor:pointer; padding:0;}
  .swatch.on{box-shadow:0 0 0 2px var(--ink);}

  /* Scenarios */
  .scen-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(300px,1fr)); gap:16px;}
  .scen-card .scen-name{font-size:14.5px; font-weight:800; padding:3px 5px;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 10px; margin:10px 0 12px;}
  .form-grid .f label{display:block; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-bottom:3px;}
  .form-grid .f .ci{border-color:var(--line); background:#fff; font-size:12.5px; padding:5px 7px;}
  .form-grid .f.full{grid-column:span 2;}
  .form-grid .f .ro{padding:2px 0; font-weight:700;}
  .check{display:flex; gap:7px; align-items:flex-start; font-size:12px; line-height:1.35;}
  .check input{margin-top:1px; accent-color:var(--ink);}
  .out-list{border-top:1px solid var(--line); padding-top:10px;}
  .out-row{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; padding:4px 0; border-bottom:1px dotted #ececea;}
  .out-row span:first-child{color:var(--muted);}
  .out-row span:last-child{font-weight:700; font-variant-numeric:tabular-nums; text-align:right;}
  .out-row.big{font-size:14px; border-bottom:none; padding-top:7px;}
  .out-row.big span:last-child{font-size:17px; font-weight:800;}
  .flags{margin-top:10px; font-size:11.5px; color:#7d5c06; line-height:1.45;}
  .flags div{margin-bottom:3px;}
  .qty-row{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  .chip-btn{font-family:inherit; font-size:12.5px; font-weight:700; padding:7px 14px; border-radius:999px; border:1.5px solid var(--line); background:#fff; color:var(--ink); cursor:pointer;}
  .chip-btn:hover{border-color:var(--ink);}
  .chip-btn.on{background:var(--ink); color:#fff; border-color:var(--ink);}
  .pill-tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}

  /* Findings */
  .finding{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:18px; align-items:start;}
  .finding textarea.ci{min-height:110px; border-color:var(--line); background:#fff; font-size:13px; line-height:1.5; padding:9px 11px;}
  .evidence{background:#fafaf9; border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:12px; line-height:1.5;}
  .evidence .ev-h{font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:6px; display:flex; gap:6px; align-items:center;}
  .evidence ul{margin:0; padding-left:16px;}
  .evidence li{margin-bottom:3px;}
  .rich{font-size:13.5px; line-height:1.6;}
  .rich p{margin:0 0 8px; font-size:13.5px;}
  .rich ul{margin:0 0 8px; padding-left:20px;}
  .rich .blank{font-style:italic;}
  .auto-summary{font-size:14px; line-height:1.65;}
  @media (max-width:1050px){ .finding{grid-template-columns:1fr;} }

  /* Save & publish */
  .steps{counter-reset:s; list-style:none; padding:0; margin:0;}
  .steps li{counter-increment:s; position:relative; padding:0 0 12px 34px; font-size:13px; line-height:1.55;}
  .steps li::before{content:counter(s); position:absolute; left:0; top:0; width:22px; height:22px; border-radius:50%; background:var(--ink); color:#fff; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center;}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; background:#f3f3f1; padding:1px 5px; border-radius:4px;}
  .layers{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px;}
  .layer{border:1px solid var(--line); border-radius:8px; padding:12px 14px; background:#fff; font-size:12px; line-height:1.5;}
  .layer b{display:block; font-size:12.5px; margin-bottom:4px;}
  @media (max-width:1050px){ .layers{grid-template-columns:1fr;} }

  footer{margin-top:50px; padding-top:16px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); font-style:italic;}

  /* Modal (same as Roadmap / BOM) */
  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .modal-overlay.open{display:flex;}
  .modal{background:#fff; border-radius:10px; width:100%; max-width:640px; max-height:88vh; overflow-y:auto; padding:24px 26px; box-shadow:0 12px 40px rgba(0,0,0,.25);}
  .modal.wide{max-width:980px;}
  .modal h3{margin:0 0 16px; font-size:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-bottom:5px;}
  .field input[type=text], .field input[type=number], .field input[type=date], .field select, .field textarea{width:100%; font-family:inherit; font-size:13px; padding:8px 10px; border:1px solid var(--line); border-radius:6px; color:var(--ink); background:#fff;}
  .field textarea{resize:vertical; min-height:60px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .field-row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}
  .hint{font-size:11px; color:var(--muted); margin-top:4px; line-height:1.45;}
  .paste-area{width:100%; min-height:150px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; padding:10px; border:1px solid var(--line); border-radius:6px;}
  .preview-wrap{max-height:260px; overflow:auto; border:1px solid var(--line); border-radius:6px; margin-top:10px;}

  /* Tooltip + toast */
  #tip{position:fixed; z-index:80; pointer-events:none; background:var(--ink); color:#fff; font-size:11.5px; line-height:1.45; padding:7px 10px; border-radius:6px; max-width:300px; white-space:pre-line; display:none; box-shadow:0 4px 14px rgba(0,0,0,.2);}
  #toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:90; background:var(--ink); color:#fff; font-size:12.5px; padding:10px 16px; border-radius:8px; display:none; align-items:center; gap:12px; box-shadow:0 8px 24px rgba(0,0,0,.25); max-width:90vw;}
  #toast.open{display:flex;}
  #toast button{font-family:inherit; font-size:12px; font-weight:800; background:none; border:1px solid rgba(255,255,255,.5); color:#fff; padding:4px 10px; border-radius:5px; cursor:pointer;}
  .preview-pill{position:fixed; right:22px; bottom:22px; z-index:60; display:none;}
  body.previewing .preview-pill{display:block;}

  /* Report */
  .report{background:#fff; border:1px solid var(--line); border-radius:10px; padding:44px 52px; max-width:920px; margin:0 auto;}
  .report h1{font-size:24px;}
  .report h2{font-size:16px; margin:30px 0 10px; padding-bottom:6px; border-bottom:2px solid var(--ink);}
  .report .rmeta{display:flex; gap:22px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin:8px 0 20px;}
  .report .rmeta b{color:var(--ink);}
  .report table.grid{font-size:11.5px;}
  .report .summary-grid{grid-template-columns:repeat(4,minmax(0,1fr));}
  .report .block{break-inside:avoid; page-break-inside:avoid; margin-bottom:14px;}
  .report-bar{display:flex; justify-content:space-between; align-items:center; max-width:920px; margin:0 auto 14px;}

  /* View-only mode: hide editing affordances entirely */
  .view-only .edit-only{display:none !important;}
  .view-only .icon-btn{display:none;}
  .view-only td.actions, .view-only th.actions{display:none;}
  .view-only .add-row{display:none;}
  html:not(.view-only) .view-only-show{display:none !important;}

  @media print{
    @page{margin:14mm 12mm;}
    body{background:#fff;}
    .container{padding:0; max-width:none;}
    .toolbar, .tabs, .doc-head, #banner, footer, .report-bar, .no-print, #toast, #tip, .preview-pill{display:none !important;}
    .report{border:none; padding:0; max-width:none;}
    .report h2{break-after:avoid; page-break-after:avoid;}
    .table-wrap{overflow:visible; border-color:#ddd;}
    table.grid thead th{position:static;}
    .card, .summary-card{break-inside:avoid; page-break-inside:avoid;}
    *{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
    .report .summary-card .tier-label{flex-direction:column; align-items:flex-start; gap:4px;}
    .report td.nw{white-space:nowrap;}
  }
</style>

<!-- Study data. "Export HTML" rewrites the contents of this block with the
     current study, so the exported file opens with the same data anywhere. -->
<script type="application/json" id="tms-data">null</script>
<script>
"use strict";
/* =====================================================================
   Touch Pass — EPVC Time & Motion Study
   Same publishing model as the Roadmap and BOM tools:
     • the study lives in the <script id="tms-data"> block of this file
     • edits autosave to this browser while you work
     • "Export HTML" downloads a complete index.html with the data embedded
     • ?view=1 opens a clean, read-only view for coworkers
   ===================================================================== */

const SCHEMA = "touchpass-time-motion";
const SCHEMA_VERSION = 1;
const DRAFT_KEY = "touchPassTMSDraft_v1";

const PALETTE = [
  {v:"#1f9e8a", n:"Teal"}, {v:"#d97a1f", n:"Orange"}, {v:"#6452c9", n:"Purple"}, {v:"#b5556f", n:"Rose"},
  {v:"#2563b0", n:"Blue"}, {v:"#64748b", n:"Slate"}, {v:"#0891b2", n:"Cyan"}, {v:"#b8860b", n:"Gold"}
];
const PALETTE_VALUES = PALETTE.map(p=>p.v);
// Time-category colours (fixed by category, never by rank)
const TC = {run:"#2563b0", setup:"#d97a1f", rework:"#b5556f", machine:"#6452c9", wait:"#a3a39e", elapsed:"#1c1c1c"};
const MOTION_CLASSES = [
  {k:"va",        n:"Value-adding",        c:"#1f9e8a"},
  {k:"transport", n:"Material transport",  c:"#d97a1f"},
  {k:"setup",     n:"Setup / positioning", c:"#6452c9"},
  {k:"inspect",   n:"Inspection",          c:"#2563b0"},
  {k:"wait",      n:"Waiting",             c:"#a3a39e"},
  {k:"rework",    n:"Rework",              c:"#b5556f"}
];
const MC = {}; MOTION_CLASSES.forEach(m=>MC[m.k]=m);
const SOURCING = [{k:"inhouse", n:"In-house"}, {k:"outsourced", n:"Outsourced"}, {k:"tbd", n:"Undecided"}];
const SRC = {}; SOURCING.forEach(s=>SRC[s.k]=s);
const IMP_STATUS = [
  {k:"idea",     n:"Idea",                           hyp:true},
  {k:"planned",  n:"Planned",                        hyp:true},
  {k:"testing",  n:"Implemented — not yet measured", hyp:true},
  {k:"measured", n:"Implemented & measured",         hyp:false},
  {k:"rejected", n:"Rejected",                       hyp:true}
];
const IS = {}; IMP_STATUS.forEach(s=>IS[s.k]=s);
const LEVELS = ["Low","Medium","High"];
const CATEGORIES = ["Preparation","Layout","Machining","Finishing","Forming","Assembly","Inspection","Packaging","Other"];
const SCEN_COLORS = ["#64748b","#1f9e8a","#2563b0","#6452c9"];
const MAX_TEXT = 6000;

const TABS = [
  ["overview","Overview"], ["process","Process & Operations"], ["time","Time Study"],
  ["motion","Motion & Efficiency"], ["production","Production Analysis"], ["findings","Findings"],
  ["report","Report"], ["data","Save & Publish"]
];

const DEFAULT_LIMITS = [
  "- Times come from hand-built prototypes and include learning effects, improvised setups and one-off problem solving. They are not industrial cycle times.",
  "- Production estimates scale observed per-board times and assumed batch sizes. They do not model learning curves, automation, fixtures that don't exist yet, or a partner's equipment.",
  "- Outsourced operations are costed only from quotes entered in this study.",
  "- Station time assumes waiting (heating, cooling) occupies the workstation unless more stations are entered.",
  "- Small sample sizes make averages sensitive to a single unusual build. Check the observation count (n) before relying on any figure."
].join("\n");

/* ---------- small utilities ---------- */
const $ = (s, r)=> (r||document).querySelector(s);
const $$ = (s, r)=> Array.from((r||document).querySelectorAll(s));
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(p){ return (p||"x")+"_"+Math.random().toString(36).slice(2,9); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function isNum(v){ return typeof v==="number" && isFinite(v); }
function sum(a){ let s=0; a.forEach(v=>{ if(isNum(v)) s+=v; }); return s; }
function mean(a){ const v=a.filter(isNum); return v.length? sum(v)/v.length : null; }
function sd(a){ const v=a.filter(isNum); if(v.length<2) return null; const m=sum(v)/v.length; return Math.sqrt(sum(v.map(x=>(x-m)*(x-m)))/(v.length-1)); }
function minOf(a){ const v=a.filter(isNum); return v.length? Math.min(...v) : null; }
function maxOf(a){ const v=a.filter(isNum); return v.length? Math.max(...v) : null; }
function trunc(s,n){ s=String(s||""); return s.length>n ? s.slice(0,n-1)+"…" : s; }
function pct(v, d){ return isNum(v) ? (v*100).toFixed(d==null?0:d)+"%" : "—"; }
function fmtNum(v, d){ if(!isNum(v)) return "—"; return v.toLocaleString("en-US",{minimumFractionDigits:d||0, maximumFractionDigits:d||0}); }
function fmtMoney(v){ if(!isNum(v)) return "—"; return "$"+v.toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtMoney0(v){ if(!isNum(v)) return "—"; return "$"+Math.round(v).toLocaleString("en-US"); }
function plural(n, w, p){ return n+" "+(n===1? w : (p||w+"s")); }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDate(s){
  if(!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return s||"";
  const [y,m,d]=s.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString("en-US",{month:"short", day:"numeric", year:"numeric"});
}
function fmtStamp(ms){ if(!ms) return "—"; const d=new Date(ms); return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})+" · "+d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}); }
function hashStr(s){ let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; } return (h>>>0).toString(36); }

/* ---------- time parsing & formatting ----------
   All times are stored as decimal minutes. Inputs accept:
   4.5 · 4:30 (m:ss) · 1:05:30 (h:mm:ss) · 90s · 4m 30s · 1h 5m · 1.5h            */
function parseTime(raw){
  if(raw==null) return {ok:true, val:null};
  let s=String(raw).trim().toLowerCase().replace(/,/g,".");
  if(s==="") return {ok:true, val:null};
  let m=s.match(/^(\d+):([0-5]?\d(?:\.\d+)?)$/);
  if(m) return {ok:true, val:+m[1] + (+m[2])/60};
  m=s.match(/^(\d+):([0-5]\d):([0-5]\d(?:\.\d+)?)$/);
  if(m) return {ok:true, val:(+m[1])*60 + (+m[2]) + (+m[3])/60};
  if(/^\d*\.?\d+$/.test(s)) return {ok:true, val:parseFloat(s)};
  m=s.match(/^(?:(\d*\.?\d+)\s*h(?:rs?|ours?)?)?\s*(?:(\d*\.?\d+)\s*m(?:in(?:s|utes?)?)?)?\s*(?:(\d*\.?\d+)\s*s(?:ecs?|econds?)?)?$/);
  if(m && (m[1]||m[2]||m[3])) return {ok:true, val:(+m[1]||0)*60 + (+m[2]||0) + (+m[3]||0)/60};
  return {ok:false};
}
function parseNum(raw, kind){
  if(raw==null) return {ok:true, val:null};
  let s=String(raw).trim().replace(/[$,%\s]/g,"");
  if(s==="") return {ok:true, val:null};
  if(!/^-?\d*\.?\d+$/.test(s)) return {ok:false};
  let v=parseFloat(s);
  if(v<0) return {ok:false};
  if(kind==="int"){ if(Math.round(v)!==v || v<1) return {ok:false}; }
  return {ok:true, val:v};
}
function tf(){ return (S && S.settings && S.settings.timeFormat)==="mss" ? "mss" : "dec"; }
function mss(v){
  let sec=Math.round(v*60);
  const h=Math.floor(sec/3600); sec-=h*3600;
  const m=Math.floor(sec/60), s=sec-m*60;
  return h ? h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0") : m+":"+String(s).padStart(2,"0");
}
// Value shown inside an input
function fmtT(v){
  if(!isNum(v)) return "";
  if(tf()==="mss") return mss(v);
  return String(Math.round(v*100)/100);
}
// Display with units, for read-only cells and summaries
function fmtD(v, opts){
  if(!isNum(v)) return "—";
  if(tf()==="mss") return mss(v);
  const d = (opts && opts.d!=null) ? opts.d : (Math.abs(v)<10 ? 1 : 0);
  return fmtNum(v, d)+" min";
}
// Big totals: switch to hours once past 90 minutes
function fmtH(v){
  if(!isNum(v)) return "—";
  if(Math.abs(v) < 90) return fmtD(v);
  return fmtNum(v/60, 1)+" h";
}
function fmtHrs(h){ if(!isNum(h)) return "—"; return fmtNum(h, h<10?1:0)+" h"; }

/* ---------- state ---------- */
function makeTemplate(){
  const stages = [
    {id:"st_prep", name:"Preparation",            color:"#1f9e8a"},
    {id:"st_fab",  name:"Cutting & Finishing",    color:"#d97a1f"},
    {id:"st_form", name:"Forming",                color:"#6452c9"},
    {id:"st_asm",  name:"Assembly",               color:"#b5556f"},
    {id:"st_qa",   name:"Inspection & Packaging", color:"#2563b0"}
  ];
  const opRows = [
    ["op_prep",  "OP-10", "Material preparation",           "st_prep", "Preparation", "Stage 19 mm EPVC sheet and components."],
    ["op_layout","OP-20", "Measuring / layout",             "st_prep", "Layout",      "Measure and mark cut lines, bend lines and hardware locations."],
    ["op_cut",   "OP-30", "Cutting / machining",            "st_fab",  "Machining",   "Cut panels to size and machine features."],
    ["op_edge",  "OP-40", "Edge finishing",                 "st_fab",  "Finishing",   "Clean up and finish cut edges."],
    ["op_heat",  "OP-50", "Heat forming",                   "st_form", "Forming",     "Heat and bend EPVC to shape; hold while it cools."],
    ["op_hinge", "OP-60", "Hinge / hardware installation",  "st_asm",  "Assembly",    "Locate, drill and fasten hinges and mounting hardware."],
    ["op_net",   "OP-70", "Elastic / netting assembly",     "st_asm",  "Assembly",    "Install elastic / bungee netting components."],
    ["op_test",  "OP-80", "Inspection / testing",           "st_qa",   "Inspection",  "Check fit, fold action and netting tension."],
    ["op_pack",  "OP-90", "Packaging",                      "st_qa",   "Packaging",   "Prepare the board for shipping."]
  ];
  const operations = opRows.map(r=>({id:r[0], code:r[1], name:r[2], stageId:r[3], category:r[4], description:r[5],
    tools:"", materials:"", workstation:"", responsible:"", sourcing:"inhouse", notes:""}));
  return {
    schema: SCHEMA, version: SCHEMA_VERSION,
    meta: {title:"Touch Pass — EPVC Time & Motion Study", subtitle:"Interim EPVC game board · prototype fabrication", preparedBy:"Reese", linkRoadmap:"", linkBom:"", updatedAt:0, exportedAt:0},
    settings: {timeFormat:"dec", laborIncludesSetupRework:false},
    stages, operations,
    observations: [], motions: [], improvements: [],
    production: {qty:100},
    scenarios: [
      makeScenario("sc_cur", "Current prototyping process", "Observed process and batch sizes as measured.", {batchSize:null}),
      makeScenario("sc_imp", "Improved in-house fabrication", "Observed times, larger batches, minus estimated savings from the improvement log.", {batchSize:10, applyImprovements:true}),
      makeScenario("sc_hyb", "Hybrid / outsourced", "Partner handles machining and heat forming; assembly stays in-house. Enter partner quotes per board.", {batchSize:10, applyImprovements:true,
        ops:{op_cut:{mode:"outsourced"}, op_edge:{mode:"outsourced"}, op_heat:{mode:"outsourced"}}})
    ],
    findings: {summaryNote:"", bottlenecks:"", inefficiencies:"", improvements:"", manufacturability:"", nextSteps:"", limitations:DEFAULT_LIMITS}
  };
}
function makeScenario(id, name, note, extra){
  return Object.assign({id:id||uid("sc"), name:name||"New scenario", note:note||"", batchSize:10, operators:1, rate:null, hoursPerDay:8,
    productivePct:85, reworkPct:null, applyImprovements:false, leadDays:null, ops:{}}, extra||{});
}

// Coerces any loaded/imported object into a valid study. Throws if it isn't one.
function str(v, max){ if(v==null) return ""; return String(v).slice(0, max||MAX_TEXT); }
function nn(v){ if(v===null || v===undefined || v==="") return null; const n=Number(v); return (isFinite(n) && n>=0) ? n : null; }
function posInt(v, dflt){ const n=Number(v); return (isFinite(n) && n>=1) ? Math.round(n) : dflt; }
function pick(v, allowed, dflt){ return allowed.includes(v) ? v : dflt; }
function normalizeState(raw){
  if(!raw || typeof raw!=="object" || Array.isArray(raw)) throw new Error("The file doesn't contain a study.");
  if(raw.schema && raw.schema!==SCHEMA) throw new Error("This file isn't a Touch Pass Time & Motion study (it's \""+str(raw.schema,60)+"\").");
  if(!raw.schema && !Array.isArray(raw.operations) && !Array.isArray(raw.observations)) throw new Error("This file isn't a Touch Pass Time & Motion study.");
  const t = makeTemplate();
  const s = {schema:SCHEMA, version:SCHEMA_VERSION};
  const rm = raw.meta||{};
  s.meta = {title:str(rm.title,200)||t.meta.title, subtitle:str(rm.subtitle,300), preparedBy:str(rm.preparedBy,120),
    linkRoadmap:safeUrl(rm.linkRoadmap), linkBom:safeUrl(rm.linkBom),
    updatedAt:Number(rm.updatedAt)||0, exportedAt:Number(rm.exportedAt)||0};
  const rs = raw.settings||{};
  s.settings = {timeFormat: rs.timeFormat==="mss"?"mss":"dec", laborIncludesSetupRework: !!rs.laborIncludesSetupRework};
  s.stages = (Array.isArray(raw.stages)? raw.stages : t.stages).filter(x=>x&&typeof x==="object").map(x=>({
    id:str(x.id,40)||uid("st"), name:str(x.name,80)||"Stage", color:pick(x.color, PALETTE_VALUES, PALETTE_VALUES[0])}));
  const stageIds = new Set(s.stages.map(x=>x.id));
  s.operations = (Array.isArray(raw.operations)? raw.operations : t.operations).filter(x=>x&&typeof x==="object").map(x=>({
    id:str(x.id,40)||uid("op"), code:str(x.code,20), name:str(x.name,120)||"Untitled operation",
    stageId: stageIds.has(x.stageId)? x.stageId : "", category:str(x.category,60), description:str(x.description),
    tools:str(x.tools,500), materials:str(x.materials,500), workstation:str(x.workstation,120), responsible:str(x.responsible,120),
    sourcing:pick(x.sourcing, ["inhouse","outsourced","tbd"], "inhouse"), notes:str(x.notes)}));
  dedupeIds(s.stages); dedupeIds(s.operations);
  const opIds = new Set(s.operations.map(o=>o.id));
  s.observations = (Array.isArray(raw.observations)? raw.observations : []).filter(x=>x&&typeof x==="object").map(x=>({
    id:str(x.id,40)||uid("ob"), date:/^\d{4}-\d{2}-\d{2}$/.test(x.date||"")? x.date : "",
    board:str(x.board,60), batch:str(x.batch,60), opId: opIds.has(x.opId)? x.opId : "",
    units:posInt(x.units,1), labor:nn(x.labor), machine:nn(x.machine), wait:nn(x.wait), setup:nn(x.setup),
    rework:nn(x.rework), elapsed:nn(x.elapsed), operators:posInt(x.operators,1), notes:str(x.notes,1000)}));
  dedupeIds(s.observations);
  s.motions = (Array.isArray(raw.motions)? raw.motions : []).filter(x=>x&&typeof x==="object").map(x=>({
    id:str(x.id,40)||uid("mo"), opId: opIds.has(x.opId)? x.opId : "", desc:str(x.desc,300), duration:nn(x.duration),
    reps:posInt(x.reps,1), cls:pick(x.cls, MOTION_CLASSES.map(m=>m.k), "va"), tools:str(x.tools,200),
    effort:pick(x.effort, ["",...LEVELS], ""), inefficiency:str(x.inefficiency,500), notes:str(x.notes,500)}));
  dedupeIds(s.motions);
  s.improvements = (Array.isArray(raw.improvements)? raw.improvements : []).filter(x=>x&&typeof x==="object").map(x=>({
    id:str(x.id,40)||uid("im"), opId: opIds.has(x.opId)? x.opId : "", problem:str(x.problem,1000), proposal:str(x.proposal,1000),
    benefit:str(x.benefit,600), savings:nn(x.savings), difficulty:pick(x.difficulty, ["",...LEVELS], ""),
    priority:pick(x.priority, ["",...LEVELS], ""), status:pick(x.status, IMP_STATUS.map(i=>i.k), "idea"), measured:nn(x.measured), notes:str(x.notes,600)}));
  dedupeIds(s.improvements);
  const rp = raw.production||{};
  s.production = {qty: posInt(rp.qty, 100)};
  s.scenarios = (Array.isArray(raw.scenarios)? raw.scenarios : t.scenarios).filter(x=>x&&typeof x==="object").slice(0,4).map(x=>{
    const sc = makeScenario(str(x.id,40)||uid("sc"), str(x.name,80)||"Scenario", str(x.note,400));
    sc.batchSize = x.batchSize==null||x.batchSize===""? null : posInt(x.batchSize, 10);
    sc.operators = posInt(x.operators,1); sc.rate = nn(x.rate); sc.hoursPerDay = nn(x.hoursPerDay); if(!sc.hoursPerDay || sc.hoursPerDay>24) sc.hoursPerDay=8;
    sc.productivePct = nn(x.productivePct); if(!sc.productivePct || sc.productivePct>100) sc.productivePct=85;
    sc.reworkPct = nn(x.reworkPct); sc.applyImprovements = !!x.applyImprovements; sc.leadDays = nn(x.leadDays);
    sc.ops = {};
    const ro = (x.ops && typeof x.ops==="object")? x.ops : {};
    Object.keys(ro).forEach(k=>{
      if(!opIds.has(k) || !ro[k] || typeof ro[k]!=="object") return;
      const o=ro[k]; const e={};
      if(["inhouse","outsourced","excluded"].includes(o.mode)) e.mode=o.mode;
      if(nn(o.timePct)!=null) e.timePct=nn(o.timePct);
      if(nn(o.setup)!=null) e.setup=nn(o.setup);
      if(nn(o.outCost)!=null) e.outCost=nn(o.outCost);
      if(nn(o.stations)!=null && nn(o.stations)>=1) e.stations=Math.round(nn(o.stations));
      sc.ops[k]=e;
    });
    return sc;
  });
  dedupeIds(s.scenarios);
  if(!s.scenarios.length) s.scenarios = t.scenarios;
  const rf = raw.findings||{};
  s.findings = {};
  ["summaryNote","bottlenecks","inefficiencies","improvements","manufacturability","nextSteps"].forEach(k=>s.findings[k]=str(rf[k]));
  s.findings.limitations = rf.limitations==null ? DEFAULT_LIMITS : str(rf.limitations);
  return s;
}
function safeUrl(v){ v=str(v,500).trim(); return /^https?:\/\/[^\s"<>]+$/i.test(v) ? v : ""; }
function dedupeIds(arr){ const seen=new Set(); arr.forEach(x=>{ while(seen.has(x.id)) x.id=uid(x.id.split("_")[0]); seen.add(x.id); }); }
function contentSig(st){ const c=Object.assign({}, st, {meta:Object.assign({}, st.meta, {updatedAt:0, exportedAt:0})}); return hashStr(JSON.stringify(c)); }

/* ---------- analytics ---------- */
// Rules (shown to the user in the Time Study definitions panel):
//  • Labor, setup and rework are person time = clock minutes × crew size.
//  • Hands-on labor = active labor + setup + rework (unless the study setting
//    says active labor already includes setup and rework).
//  • Machine, waiting and elapsed are clock time. They can overlap labor and
//    are never added into labor or into each other.
//  • Blank setup / rework / machine / waiting = none (0). Blank active labor or
//    elapsed = not recorded, so that observation is left out of those averages.
//  • Per-board values divide by the units processed in the observation.
function deriveObs(o, inc){
  const crew = o.operators>0? o.operators : 1, units = o.units>0? o.units : 1;
  const z = v=> isNum(v)? v : 0;
  const setupPM = z(o.setup)*crew, reworkPM = z(o.rework)*crew;
  let runPM=null, handsPM=null, handsClock=null;
  if(isNum(o.labor)){
    if(inc){ handsPM=o.labor*crew; runPM=Math.max(0, handsPM-setupPM-reworkPM); handsClock=o.labor; }
    else { runPM=o.labor*crew; handsPM=runPM+setupPM+reworkPM; handsClock=o.labor+z(o.setup)+z(o.rework); }
  }
  const anyTime = [o.labor,o.machine,o.wait,o.setup,o.rework,o.elapsed].some(isNum);
  return {o, crew, units, runPM, setupPM, reworkPM, handsPM, handsClock,
    recordedPM: isNum(handsPM)? handsPM : (setupPM+reworkPM),
    handsPU: isNum(handsPM)? handsPM/units : null, runPU: isNum(runPM)? runPM/units : null,
    handsClockPU: isNum(handsClock)? handsClock/units : null,
    setupPU: setupPM/units, reworkPU: reworkPM/units,
    machinePU: z(o.machine)/units, waitPU: z(o.wait)/units,
    elapsedPU: isNum(o.elapsed)? o.elapsed/units : null, anyTime};
}
function boardKey(b){ return String(b||"").trim().toLowerCase(); }

function analyze(){
  const inc = S.settings.laborIncludesSetupRework;
  const opsById = {}; S.operations.forEach((o,i)=>{ opsById[o.id]=o; });
  const stageById = {}; S.stages.forEach(s=>stageById[s.id]=s);
  const A = {opsById, stageById, rows:[], opStats:[], statsById:{}, boards:[], batches:[], warnings:[], dates:[]};
  S.observations.forEach(o=>{ const d=deriveObs(o, inc); d.op = opsById[o.opId]||null; A.rows.push(d); if(o.date) A.dates.push(o.date); });
  A.valid = A.rows.filter(r=>r.op && r.anyTime);
  A.unassigned = A.rows.filter(r=>!r.op && r.anyTime).length;
  A.emptyRows = A.rows.filter(r=>!r.anyTime).length;
  A.noLabor = A.valid.filter(r=>!isNum(r.handsPM)).length;
  A.dates.sort();

  // ----- per operation -----
  S.operations.forEach((op, idx)=>{
    const rs = A.valid.filter(r=>r.o.opId===op.id);
    const lab = rs.filter(r=>isNum(r.handsPU));
    const hv = lab.map(r=>r.handsPU);
    const st = {op, idx, stage: stageById[op.stageId]||null, rows:rs, n:rs.length, nLabor:lab.length,
      handsMean: mean(hv), handsMin:minOf(hv), handsMax:maxOf(hv), handsSd:sd(hv),
      runMean: mean(lab.map(r=>r.runPU)),
      setupPUMean: rs.length? mean(rs.map(r=>r.setupPU)) : null,
      reworkPUMean: rs.length? mean(rs.map(r=>r.reworkPU)) : null,
      machinePUMean: rs.length? mean(rs.map(r=>r.machinePU)) : null,
      waitPUMean: rs.length? mean(rs.map(r=>r.waitPU)) : null,
      elapsedPUMean: mean(rs.map(r=>r.elapsedPU)), nElapsed: rs.filter(r=>isNum(r.elapsedPU)).length,
      handsClockPUMean: mean(lab.map(r=>r.handsClockPU)),
      crewMean: rs.length? mean(rs.map(r=>r.crew)) : 1,
      unitsMean: rs.length? mean(rs.map(r=>r.units)) : null,
      totalPM: sum(rs.map(r=>r.recordedPM)), totalSetupClock: sum(rs.map(r=>r.o.setup)),
      totalRework: sum(rs.map(r=>r.o.rework)), totalMachine: sum(rs.map(r=>r.o.machine)),
      totalWait: sum(rs.map(r=>r.o.wait)), totalElapsed: sum(rs.map(r=>r.o.elapsed))};
    const setupEv = rs.filter(r=>isNum(r.o.setup) && r.o.setup>0);
    st.setupEvents = setupEv.length;
    st.setupPerEvent = setupEv.length ? mean(setupEv.map(r=>r.setupPM)) : null;
    st.cv = (isNum(st.handsSd) && st.handsMean>0) ? st.handsSd/st.handsMean : null;
    // Station time per board: how long the workstation is occupied per board.
    if(isNum(st.elapsedPUMean)){ st.station = st.elapsedPUMean; st.stationBasis="elapsed"; }
    else if(isNum(st.handsClockPUMean) || st.machinePUMean>0 || st.waitPUMean>0){
      st.station = Math.max(st.handsClockPUMean||0, (st.machinePUMean||0)+(st.waitPUMean||0)); st.stationBasis="estimated";
    } else { st.station=null; st.stationBasis=null; }
    A.opStats.push(st); A.statsById[op.id]=st;
  });
  A.withData = A.opStats.filter(s=>isNum(s.handsMean));
  A.noData = A.opStats.filter(s=>!isNum(s.handsMean));
  A.stdPerBoard = A.withData.length ? sum(A.withData.map(s=>s.handsMean)) : null;
  A.withData.forEach(s=>{ s.share = A.stdPerBoard>0 ? s.handsMean/A.stdPerBoard : null; });
  A.stdMachine = sum(A.opStats.map(s=>s.machinePUMean));
  A.stdWait = sum(A.opStats.map(s=>s.waitPUMean));
  A.stdStation = sum(A.opStats.map(s=>s.station));
  A.topLabor = A.withData.slice().sort((a,b)=>b.handsMean-a.handsMean)[0]||null;
  A.topStation = A.opStats.filter(s=>isNum(s.station)).sort((a,b)=>b.station-a.station)[0]||null;
  A.highVar = A.opStats.filter(s=>isNum(s.cv) && s.cv>=0.3).sort((a,b)=>b.cv-a.cv);

  // ----- per board -----
  const bmap = new Map();
  A.valid.forEach(r=>{
    const k = boardKey(r.o.board); if(!k) return;
    if(!bmap.has(k)) bmap.set(k, {key:k, label:r.o.board.trim(), rows:[]});
    bmap.get(k).rows.push(r);
  });
  const opsWithAnyData = new Set(A.valid.map(r=>r.o.opId));
  bmap.forEach(b=>{
    const covered = new Set(b.rows.map(r=>r.o.opId));
    b.covered = covered.size;
    b.expected = opsWithAnyData.size;
    b.missingOps = S.operations.filter(o=>opsWithAnyData.has(o.id) && !covered.has(o.id));
    b.labor = sum(b.rows.filter(r=>isNum(r.handsPU)).map(r=>r.handsPU));
    b.laborGaps = b.rows.filter(r=>!isNum(r.handsPU)).length;
    b.elapsed = sum(b.rows.filter(r=>isNum(r.elapsedPU)).map(r=>r.elapsedPU));
    b.elapsedGaps = b.rows.filter(r=>!isNum(r.elapsedPU)).length;
    b.rework = sum(b.rows.map(r=>r.reworkPU));
    b.complete = b.missingOps.length===0 && b.laborGaps===0;
    b.elapsedComplete = b.missingOps.length===0 && b.elapsedGaps===0;
    const ds = b.rows.map(r=>r.o.date).filter(Boolean).sort();
    b.firstDate = ds[0]||""; b.lastDate = ds[ds.length-1]||"";
    A.boards.push(b);
  });
  A.boards.sort((a,b)=> a.label.localeCompare(b.label, undefined, {numeric:true}));
  A.noBoardId = A.valid.filter(r=>!boardKey(r.o.board)).length;
  const comp = A.boards.filter(b=>b.complete);
  A.completeBoards = comp.length;
  A.avgBoardLabor = comp.length ? mean(comp.map(b=>b.labor)) : null;
  const compE = A.boards.filter(b=>b.elapsedComplete);
  A.avgBoardElapsed = compE.length ? mean(compE.map(b=>b.elapsed)) : null;
  A.completeElapsedBoards = compE.length;

  // ----- per batch -----
  const tmap = new Map();
  A.valid.forEach(r=>{
    const k = boardKey(r.o.batch); if(!k) return;
    if(!tmap.has(k)) tmap.set(k, {key:k, label:r.o.batch.trim(), rows:[]});
    tmap.get(k).rows.push(r);
  });
  tmap.forEach(t=>{
    t.boards = new Set(t.rows.map(r=>boardKey(r.o.board)).filter(Boolean)).size;
    // Units in a batch: the most units seen in any single operation of the batch
    t.units = maxOf(S.operations.map(op=>sum(t.rows.filter(r=>r.o.opId===op.id).map(r=>r.units))));
    t.setupPM = sum(t.rows.map(r=>r.setupPM));
    t.handsPM = sum(t.rows.map(r=>r.recordedPM));
    t.setupPerUnit = t.units ? t.setupPM/t.units : null;
    A.batches.push(t);
  });
  A.batches.sort((a,b)=> a.label.localeCompare(b.label, undefined, {numeric:true}));

  // ----- totals (as recorded) -----
  A.tot = {
    obs: A.valid.length,
    handsPM: sum(A.valid.map(r=>r.recordedPM)),
    runPM: sum(A.valid.map(r=>r.runPM)),
    setupClock: sum(A.valid.map(r=>r.o.setup)), setupPM: sum(A.valid.map(r=>r.setupPM)),
    reworkClock: sum(A.valid.map(r=>r.o.rework)), reworkPM: sum(A.valid.map(r=>r.reworkPM)),
    machine: sum(A.valid.map(r=>r.o.machine)), wait: sum(A.valid.map(r=>r.o.wait)),
    elapsed: sum(A.valid.map(r=>r.o.elapsed)), nElapsed: A.valid.filter(r=>isNum(r.o.elapsed)).length,
    multiCrew: A.valid.some(r=>r.crew>1)
  };
  A.setupPerBatch = A.batches.length ? mean(A.batches.map(b=>b.setupPM)) : null;

  // ----- stage totals (per board, op averages) -----
  A.stageTotals = [];
  const stMap = new Map();
  A.withData.forEach(s=>{
    const key = s.stage ? s.stage.id : "_none";
    if(!stMap.has(key)) stMap.set(key, {stage:s.stage, name:s.stage? s.stage.name : "No stage", color:s.stage? s.stage.color : "#a3a39e", value:0});
    stMap.get(key).value += s.handsMean;
  });
  S.stages.forEach(st=>{ if(stMap.has(st.id)) A.stageTotals.push(stMap.get(st.id)); });
  if(stMap.has("_none")) A.stageTotals.push(stMap.get("_none"));

  // ----- data warnings -----
  if(A.unassigned) A.warnings.push(plural(A.unassigned,"observation")+" have no operation selected and are left out of every calculation.");
  if(A.noLabor) A.warnings.push(plural(A.noLabor,"observation")+" have no active labor recorded; they are excluded from labor averages (their setup/rework still counts in totals).");
  if(A.valid.length && A.noData.length) A.warnings.push("No labor data yet for "+A.noData.map(s=>s.op.name).join(", ")+". Per-board labor estimates leave "+(A.noData.length===1?"it":"them")+" out.");
  if(A.noBoardId) A.warnings.push(plural(A.noBoardId,"observation")+" have no Board ID, so they count toward operation averages but not board-by-board totals.");
  const lowN = A.withData.filter(s=>s.nLabor<3);
  if(lowN.length && A.valid.length) A.warnings.push("Fewer than 3 labor observations for "+lowN.map(s=>s.op.name).join(", ")+". Treat those averages as indicative.");
  return A;
}

/* ---------- production model (all outputs are projections) ---------- */
function improvementSavingsByOp(){
  const m = {};
  S.improvements.forEach(im=>{
    if(!im.opId || !isNum(im.savings)) return;
    if(!["idea","planned","testing"].includes(im.status)) return; // measured ones already show up in new observations
    m[im.opId] = (m[im.opId]||0) + im.savings;
  });
  return m;
}
function scenOp(sc, op){
  const e = sc.ops[op.id] || {};
  const dflt = op.sourcing==="outsourced" ? "outsourced" : "inhouse";
  return {mode: e.mode || dflt, timePct: isNum(e.timePct)? e.timePct : 100, setup: isNum(e.setup)? e.setup : null,
    outCost: isNum(e.outCost)? e.outCost : null, stations: isNum(e.stations)&&e.stations>=1? e.stations : 1, raw:e};
}
function runScenario(sc, A, qty){
  const Q = qty, B = sc.batchSize ? Math.ceil(Q/sc.batchSize) : null;
  const sav = sc.applyImprovements ? improvementSavingsByOp() : {};
  const shiftMin = (sc.hoursPerDay||8)*60*((sc.productivePct||85)/100);
  const R = {sc, Q, batches:B, ops:[], flags:[], runMin:0, setupMin:0, reworkMin:0, machineMin:0, outCost:0, outMissing:[], noData:[], savingsApplied:0};
  S.operations.forEach(op=>{
    const st = A.statsById[op.id], cfg = scenOp(sc, op);
    const r = {op, cfg, st, mode:cfg.mode};
    if(cfg.mode==="excluded"){ R.ops.push(r); return; }
    if(cfg.mode==="outsourced"){
      r.cost = isNum(cfg.outCost) ? Q*cfg.outCost : null;
      if(isNum(r.cost)) R.outCost += r.cost; else R.outMissing.push(op.name);
      R.ops.push(r); return;
    }
    if(!st || !isNum(st.runMean)){ R.noData.push(op.name); r.missing=true; R.ops.push(r); return; }
    const f = cfg.timePct/100;
    const s = sav[op.id]||0;
    const run = Math.max(0, st.runMean*f - s);
    if(s>0) R.savingsApplied += Math.min(s, st.runMean*f)*Q;
    const rework = isNum(sc.reworkPct) ? run*sc.reworkPct/100 : (st.reworkPUMean||0)*f;
    let setupTot;
    if(B==null){ setupTot = Q*(st.setupPUMean||0); r.setupBasis="as observed"; }
    else { const per = isNum(cfg.setup) ? cfg.setup : (st.setupPerEvent||0); setupTot = B*per; r.setupBasis = isNum(cfg.setup)? "override" : (st.setupPerEvent? "observed per batch" : "none recorded"); r.setupPerBatch=per; }
    r.runMin = Q*run; r.reworkMin = Q*rework; r.setupMin = setupTot;
    r.laborMin = r.runMin + r.reworkMin + r.setupMin;
    r.machineMin = Q*(st.machinePUMean||0)*f;
    const crew = st.crewMean||1;
    const stationPU = isNum(st.station) ? Math.max(0, st.station*f - s/crew) : 0;
    r.stationMin = (Q*stationPU + setupTot/crew) / cfg.stations;
    R.runMin += r.runMin; R.reworkMin += r.reworkMin; R.setupMin += r.setupMin; R.machineMin += r.machineMin;
    R.ops.push(r);
  });
  R.laborMin = R.runMin + R.reworkMin + R.setupMin;
  R.laborHours = R.laborMin/60;
  R.laborCost = isNum(sc.rate) ? R.laborHours*sc.rate : null;
  R.totalCost = isNum(R.laborCost) ? R.laborCost + R.outCost : null;
  R.costPerBoard = isNum(R.totalCost) && Q ? R.totalCost/Q : null;
  R.laborPerBoard = Q ? R.laborMin/Q : null;
  R.laborDays = shiftMin>0 ? R.laborMin/((sc.operators||1)*shiftMin) : null;
  const inh = R.ops.filter(r=>isNum(r.stationMin));
  R.bottleneck = inh.sort((a,b)=>b.stationMin-a.stationMin)[0]||null;
  R.capDays = R.bottleneck && shiftMin>0 ? R.bottleneck.stationMin/shiftMin : null;
  R.workdays = (isNum(R.laborDays)||isNum(R.capDays)) ? Math.max(R.laborDays||0, R.capDays||0) + (R.outCost>0||R.outMissing.length ? (sc.leadDays||0) : 0) : null;
  R.limitedBy = isNum(R.laborDays)&&isNum(R.capDays) ? (R.capDays>R.laborDays ? "capacity" : "labor") : "labor";
  if(R.noData.length) R.flags.push("No observed labor for "+R.noData.join(", ")+" (in-house) — not included.");
  if(R.outMissing.length) R.flags.push("Enter a partner cost per board for "+R.outMissing.join(", ")+" — outsourced cost is incomplete.");
  if(!isNum(sc.rate)) R.flags.push("Enter an hourly labor rate to see labor cost.");
  if(R.outCost>0 || R.outMissing.length){ if(!isNum(sc.leadDays)) R.flags.push("Outsourced lead time not entered — calendar estimate covers in-house work only."); }
  return R;
}
/* =====================================================================
   Charts — hand-built SVG/HTML, no libraries, so the file works offline.
   Every mark carries a data-tip for the hover tooltip.
   ===================================================================== */
function niceMax(v){
  if(!(v>0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v/p;
  const step = n<=1?1 : n<=2?2 : n<=2.5?2.5 : n<=5?5 : 10;
  return step*p;
}
function ticks(max, count){ const out=[]; const step=max/(count||4); for(let i=0;i<=(count||4);i++) out.push(step*i); return out; }
function axisLbl(v){ if(tf()==="mss" && v<600) return mss(v); return fmtNum(v, (Math.round(v*10)%10) ? 1 : 0); }
// bar with rounded data-end on the right
function barR(x,y,w,h,r){
  if(w<=0) return "";
  r=Math.min(r, w, h/2);
  return `M${x},${y} h${w-r} a${r},${r} 0 0 1 ${r},${r} v${h-2*r} a${r},${r} 0 0 1 ${-r},${r} h${-(w-r)} z`;
}
function barT(x,y,w,h,r){ // rounded top (vertical bars)
  if(h<=0) return "";
  r=Math.min(r, h, w/2);
  return `M${x},${y+h} v${-(h-r)} a${r},${r} 0 0 1 ${r},${-r} h${w-2*r} a${r},${r} 0 0 1 ${r},${r} v${h-r} z`;
}
const HATCH_DEF = `<defs><pattern id="hatchP" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff" fill-opacity=".0"/><line x1="0" y1="0" x2="0" y2="6" stroke="#fff" stroke-width="2.2" stroke-opacity=".75"/></pattern></defs>`;
function emptyChart(msg){ return `<div class="chart-empty">${esc(msg||"No data yet.")}</div>`; }

/* Horizontal ranked bars. rows: {label, sub, value, color, valueLabel, tip, hatch} */
function hbarChart(w, rows, o){
  o=o||{};
  if(!rows.length) return emptyChart(o.empty);
  const lw = Math.min(o.labelW||190, Math.max(120, w*0.34)), vw = o.valW||110, rh = o.rowH||28;
  const max = niceMax(o.max || Math.max(...rows.map(r=>r.value||0)));
  const bw = Math.max(40, w-lw-vw-6), h = rows.length*rh + 22;
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(o.aria||"Bar chart")}">${HATCH_DEF}`;
  ticks(max,4).forEach(t=>{ const x=lw+t/max*bw; s+=`<line class="gridline" x1="${x}" x2="${x}" y1="0" y2="${rows.length*rh}"/><text class="axis" x="${x}" y="${rows.length*rh+14}" text-anchor="middle">${esc(axisLbl(t))}</text>`; });
  rows.forEach((r,i)=>{
    const y=i*rh, bh=12, by=y+(rh-bh)/2, len = r.value>0 ? Math.max(2, r.value/max*bw) : 0;
    s += `<g class="hit" data-tip="${esc(r.tip||"")}"><rect class="rowbg" x="0" y="${y}" width="${w}" height="${rh}" fill="transparent"/>`;
    s += `<text class="lbl" x="${lw-10}" y="${y+rh/2}" text-anchor="end" dominant-baseline="central">${esc(trunc(r.label, Math.floor(lw/6.6)))}</text>`;
    s += `<path class="mark" d="${barR(lw,by,len,bh,4)}" fill="${r.color||TC.run}"/>`;
    if(r.hatch) s += `<path d="${barR(lw,by,len,bh,4)}" fill="url(#hatchP)"/>`;
    s += `<text class="val${r.strong?" strong":""}" x="${lw+len+6}" y="${y+rh/2}" dominant-baseline="central">${esc(r.valueLabel)}</text></g>`;
  });
  s += `<line class="baseline" x1="${lw}" x2="${lw}" y1="0" y2="${rows.length*rh}"/></svg>`;
  return s;
}

/* Donut with legend. segs: {label, value, color} */
function donutChart(w, segs, o){
  o=o||{};
  segs = segs.filter(s=>s.value>0);
  if(!segs.length) return emptyChart(o.empty);
  const total = sum(segs.map(s=>s.value));
  const size = Math.min(210, Math.max(150, w*0.42)), R=size/2-4, r=R*0.62, cx=size/2, cy=size/2;
  const legW = w-size-24, rowH = 24, h = Math.max(size, segs.length*rowH+10);
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(o.aria||"Donut chart")}">`;
  let a0 = -Math.PI/2;
  segs.forEach(sg=>{
    const frac = sg.value/total, a1 = a0 + frac*Math.PI*2;
    const tip = `${sg.label}\n${fmtD(sg.value)} per board · ${pct(frac)}`;
    let d;
    if(frac>=0.9999){
      d = `M${cx},${cy-R} A${R},${R} 0 1 1 ${cx-0.01},${cy-R} L${cx-0.01},${cy-r} A${r},${r} 0 1 0 ${cx},${cy-r} Z`;
    } else {
      const large = a1-a0>Math.PI ? 1:0;
      const p = (rad,ang)=> [cx+rad*Math.cos(ang), cy+rad*Math.sin(ang)];
      const [x1,y1]=p(R,a0),[x2,y2]=p(R,a1),[x3,y3]=p(r,a1),[x4,y4]=p(r,a0);
      d = `M${x1},${y1} A${R},${R} 0 ${large} 1 ${x2},${y2} L${x3},${y3} A${r},${r} 0 ${large} 0 ${x4},${y4} Z`;
    }
    s += `<g class="hit" data-tip="${esc(tip)}"><path class="mark" d="${d}" fill="${sg.color}" stroke="#fff" stroke-width="2"/></g>`;
    a0 = a1;
  });
  s += `<text x="${cx}" y="${cy-6}" text-anchor="middle" class="val strong" style="font-size:17px">${esc(fmtH(total))}</text>`;
  s += `<text x="${cx}" y="${cy+12}" text-anchor="middle" class="axis">${esc(o.centerSub||"per board")}</text>`;
  const ly0 = (h - segs.length*rowH)/2;
  segs.forEach((sg,i)=>{
    const y = ly0 + i*rowH + rowH/2, x = size+24;
    s += `<g class="hit" data-tip="${esc(sg.label+"\n"+fmtD(sg.value)+" per board · "+pct(sg.value/total))}"><rect x="${x}" y="${y-5.5}" width="11" height="11" rx="3" fill="${sg.color}"/>`;
    s += `<text class="lbl" x="${x+18}" y="${y}" dominant-baseline="central">${esc(trunc(sg.label, Math.max(10, Math.floor((legW-110)/6.6))))}</text>`;
    s += `<text class="val" x="${w}" y="${y}" text-anchor="end" dominant-baseline="central">${esc(fmtD(sg.value))} · ${pct(sg.value/total)}</text></g>`;
  });
  return s + `</svg>`;
}

/* Vertical grouped bars. cats: [{label, sub, values:[..], partial}], series: [{name,color}] */
function vbarChart(w, cats, series, o){
  o=o||{};
  if(!cats.length) return emptyChart(o.empty);
  const h=o.h||230, padL=44, padB=40, padT=14, ph=h-padB-padT, pw=w-padL-8;
  const max = niceMax(Math.max(...cats.flatMap(c=>c.values.map(v=>v||0))));
  const gw = pw/cats.length, bw = Math.min(26, (gw*0.7)/series.length);
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(o.aria||"Bar chart")}">${HATCH_DEF}`;
  ticks(max,4).forEach(t=>{ const y=padT+ph-t/max*ph; s+=`<line class="gridline" x1="${padL}" x2="${w-8}" y1="${y}" y2="${y}"/><text class="axis" x="${padL-6}" y="${y}" text-anchor="end" dominant-baseline="central">${esc(axisLbl(t))}</text>`; });
  cats.forEach((c,i)=>{
    const gx = padL + i*gw + (gw - bw*series.length - 2*(series.length-1))/2;
    series.forEach((se,j)=>{
      const v = c.values[j];
      const x = gx + j*(bw+2);
      if(!isNum(v)) return;
      const bh = v>0 ? Math.max(2, v/max*ph) : 0, y = padT+ph-bh;
      const tip = `${c.label} — ${se.name}\n${fmtD(v)}${c.partial?"\nPartial: "+c.partial:""}`;
      s += `<g class="hit" data-tip="${esc(tip)}"><rect x="${x-2}" y="${padT}" width="${bw+4}" height="${ph}" fill="transparent"/><path class="mark" d="${barT(x,y,bw,bh,4)}" fill="${se.color}"/>`;
      if(c.partial) s += `<path d="${barT(x,y,bw,bh,4)}" fill="url(#hatchP)"/>`;
      s += `</g>`;
    });
    const cx = padL + i*gw + gw/2;
    s += `<text class="lbl" x="${cx}" y="${padT+ph+15}" text-anchor="middle">${esc(trunc(c.label, Math.max(4, Math.floor(gw/7))))}</text>`;
    if(c.sub) s += `<text class="lbl sub" x="${cx}" y="${padT+ph+29}" text-anchor="middle">${esc(c.sub)}</text>`;
  });
  s += `<line class="baseline" x1="${padL}" x2="${w-8}" y1="${padT+ph}" y2="${padT+ph}"/></svg>`;
  return s;
}

/* Strip plot: per-board hands-on labor of each observation, min–max range and mean */
function stripChart(w, items, o){
  o=o||{};
  items = items.filter(it=>it.values.length);
  if(!items.length) return emptyChart(o.empty);
  const lw = Math.min(190, Math.max(120, w*0.32)), rw = 92, rh=30, pw = Math.max(60, w-lw-rw-10);
  const max = niceMax(Math.max(...items.flatMap(it=>it.values.map(v=>v.v))));
  const h = items.length*rh + 22;
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Variation across observations">`;
  ticks(max,4).forEach(t=>{ const x=lw+t/max*pw; s+=`<line class="gridline" x1="${x}" x2="${x}" y1="0" y2="${items.length*rh}"/><text class="axis" x="${x}" y="${items.length*rh+14}" text-anchor="middle">${esc(axisLbl(t))}</text>`; });
  items.forEach((it,i)=>{
    const y = i*rh + rh/2, xs = v=> lw + v/max*pw;
    const mn = Math.min(...it.values.map(v=>v.v)), mx = Math.max(...it.values.map(v=>v.v)), mu = mean(it.values.map(v=>v.v));
    s += `<text class="lbl" x="${lw-10}" y="${y}" text-anchor="end" dominant-baseline="central">${esc(trunc(it.label, Math.floor(lw/6.6)))}</text>`;
    s += `<line x1="${xs(mn)}" x2="${xs(mx)}" y1="${y}" y2="${y}" stroke="${it.color}" stroke-width="2" stroke-opacity=".45"/>`;
    it.values.forEach(v=>{
      s += `<g class="hit" data-tip="${esc(v.tip)}"><circle cx="${xs(v.v)}" cy="${y}" r="9" fill="transparent"/><circle class="mark" cx="${xs(v.v)}" cy="${y}" r="4.5" fill="${it.color}" stroke="#fff" stroke-width="2"/></g>`;
    });
    s += `<g class="hit" data-tip="${esc(it.label+"\nMean "+fmtD(mu)+" · range "+fmtD(mn)+" – "+fmtD(mx)+"\nn = "+it.values.length+(isNum(it.cv)?" · CV "+pct(it.cv):""))}"><line x1="${xs(mu)}" x2="${xs(mu)}" y1="${y-8}" y2="${y+8}" stroke="#1c1c1c" stroke-width="2"/></g>`;
    s += `<text class="val" x="${w}" y="${y}" text-anchor="end" dominant-baseline="central">n=${it.values.length}${isNum(it.cv)?" · CV "+pct(it.cv):""}</text>`;
  });
  return s + `</svg>`;
}

/* Time categories by operation — small multiples (shared scale).
   Hands-on labor stacks run + setup + rework (those genuinely add up).
   Machine, waiting and elapsed are separate columns: they overlap labor. */
function catTable(A, compact){
  const rows = A.opStats.filter(s=>s.n>0);
  if(!rows.length) return emptyChart("Enter observations in the Time Study to see this breakdown.");
  const max = Math.max(...rows.map(s=>Math.max((s.runMean||0)+(s.setupPUMean||0)+(s.reworkPUMean||0), s.machinePUMean||0, s.waitPUMean||0, s.elapsedPUMean||0))) || 1;
  const bar = (segs, title)=>{
    const tot = sum(segs.map(x=>x.v));
    const tip = title+"\n"+segs.filter(x=>x.v>0).map(x=>x.n+": "+fmtD(x.v)).join("\n");
    return `<div class="mbar" data-tip="${esc(tip)}"><div class="track">${segs.filter(x=>x.v>0).map(x=>`<div class="seg-b" style="width:${(x.v/max*100).toFixed(2)}%;background:${x.c}"></div>`).join("")}</div><span class="v">${tot>0?esc(fmtD(tot)):'<span class="blank">—</span>'}</span></div>`;
  };
  let t = `<table class="mbar-table"><thead><tr><th style="width:${compact?150:180}px">Operation</th><th>Hands-on labor <span class="muted" style="text-transform:none;font-weight:600">(person-min / board)</span></th><th>Machine</th><th>Waiting</th><th>Elapsed</th></tr></thead><tbody>`;
  rows.forEach(s=>{
    const nm = s.op.name;
    t += `<tr><td class="oplbl" title="${esc(nm)}">${esc(nm)}</td>
      <td>${bar([{n:"Active labor",v:s.runMean||0,c:TC.run},{n:"Setup",v:s.setupPUMean||0,c:TC.setup},{n:"Rework",v:s.reworkPUMean||0,c:TC.rework}], nm+" — hands-on labor per board")}</td>
      <td>${bar([{n:"Machine",v:s.machinePUMean||0,c:TC.machine}], nm+" — machine time per board")}</td>
      <td>${bar([{n:"Waiting",v:s.waitPUMean||0,c:TC.wait}], nm+" — waiting per board")}</td>
      <td>${isNum(s.elapsedPUMean)? bar([{n:"Elapsed",v:s.elapsedPUMean,c:TC.elapsed}], nm+" — elapsed per board (n="+s.nElapsed+")") : '<span class="blank small">not recorded</span>'}</td></tr>`;
  });
  t += `</tbody></table>
  <div class="legend"><span><span class="sw" style="background:${TC.run}"></span>Active labor</span><span><span class="sw" style="background:${TC.setup}"></span>Setup</span><span><span class="sw" style="background:${TC.rework}"></span>Rework</span><span><span class="sw" style="background:${TC.machine}"></span>Machine</span><span><span class="sw" style="background:${TC.wait}"></span>Waiting</span><span><span class="sw" style="background:${TC.elapsed}"></span>Elapsed</span></div>
  <div class="card-note" style="margin-top:6px">Columns share one scale but are not added together — machine and waiting time can overlap labor, and elapsed is clock time for the whole operation.</div>`;
  return t;
}

/* Stacked horizontal bars of motion time by classification */
function motionStack(w, items){
  if(!items.length) return emptyChart("Add durations to motion steps to see this chart.");
  const lw = Math.min(190, Math.max(120, w*0.32)), vw=90, rh=28, pw=Math.max(60, w-lw-vw-6);
  const max = niceMax(Math.max(...items.map(it=>it.total)));
  const h = items.length*rh+22;
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Motion time by classification">`;
  ticks(max,4).forEach(t=>{ const x=lw+t/max*pw; s+=`<line class="gridline" x1="${x}" x2="${x}" y1="0" y2="${items.length*rh}"/><text class="axis" x="${x}" y="${items.length*rh+14}" text-anchor="middle">${esc(axisLbl(t))}</text>`; });
  items.forEach((it,i)=>{
    const y=i*rh, by=y+8; let x=lw;
    s += `<text class="lbl" x="${lw-10}" y="${y+rh/2}" text-anchor="end" dominant-baseline="central">${esc(trunc(it.label, Math.floor(lw/6.6)))}</text>`;
    const segs = MOTION_CLASSES.filter(m=>it.by[m.k]>0);
    segs.forEach((m,j)=>{
      const len = it.by[m.k]/max*pw; const last = j===segs.length-1;
      const tip = `${it.label} — ${m.n}\n${fmtD(it.by[m.k])} (${pct(it.by[m.k]/it.total)})`;
      s += `<g class="hit" data-tip="${esc(tip)}">${last? `<path class="mark" d="${barR(x,by,Math.max(1,len-0),12,4)}" fill="${m.c}"/>` : `<rect class="mark" x="${x}" y="${by}" width="${Math.max(1,len-2)}" height="12" fill="${m.c}"/>`}</g>`;
      x += len;
    });
    s += `<text class="val" x="${x+6}" y="${y+rh/2}" dominant-baseline="central">${esc(fmtD(it.total))} · ${pct(it.va/it.total)} VA</text>`;
  });
  return s + `<line class="baseline" x1="${lw}" x2="${lw}" y1="0" y2="${items.length*rh}"/></svg>`;
}

/* chart registry: placeholders <div class="chart" data-chart="key"> get drawn at their real width */
let CHARTS = {};
function chartBox(key, fn){ CHARTS[key]=fn; return `<div class="chart" data-chart="${key}"></div>`; }
function drawCharts(root){
  $$(".chart[data-chart]", root||document).forEach(el=>{
    const fn = CHARTS[el.dataset.chart]; if(!fn) return;
    const w = Math.max(280, Math.floor(el.clientWidth || 600));
    try{ el.innerHTML = fn(w); }catch(e){ console.error(e); el.innerHTML = emptyChart("Chart unavailable."); }
  });
}

function sec(title, sub, right){
  return `<div class="sec-head" style="display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap"><div><h2>${title}</h2>${sub?`<div class="subtitle">${sub}</div>`:""}</div>${right||""}</div>`;
}
function stageDot(st){ return `<span class="dot" style="background:${st? st.color : "#cfcfca"}"></span>`; }
function richText(t, emptyMsg){
  t = String(t||"").trim();
  if(!t) return emptyMsg===""? "" : `<p class="blank">${esc(emptyMsg||"Nothing written yet.")}</p>`;
  const lines = t.split(/\r?\n/); let out="", inList=false, para=[];
  const flush=()=>{ if(para.length){ out+=`<p>${para.map(esc).join("<br>")}</p>`; para=[]; } };
  lines.forEach(l=>{
    const m = l.match(/^\s*[-*•]\s+(.*)$/);
    if(m){ flush(); if(!inList){ out+="<ul>"; inList=true; } out+=`<li>${esc(m[1])}</li>`; }
    else { if(inList){ out+="</ul>"; inList=false; } if(l.trim()==="") flush(); else para.push(l); }
  });
  flush(); if(inList) out+="</ul>";
  return out;
}

function boardsChart(w, A){

function variationChart(w, A){

];
function obsSortVal(o, col, A){
  if(col==="op"){ const i=S.operations.findIndex(x=>x.id===o.opId); return i<0? 9999 : i; }
  if(col==="calc"){ const r=A.rows.find(r=>r.o===o); return r&&isNum(r.handsPU)? r.handsPU : -1; }
  const v=o[col]; if(v==null || v==="") return null; return v;
}
function visibleObs(A){
  let list = S.observations.slice();
  const q = UI.q.trim().toLowerCase();
  if(q) list = list.filter(o=>{ const op=A.opsById[o.opId]; return [o.board,o.batch,o.notes,o.date,op&&op.name,op&&op.code].some(x=>String(x||"").toLowerCase().includes(q)); });
  if(UI.fOp) list = list.filter(o=>o.opId===UI.fOp);
  if(UI.fBoard) list = list.filter(o=>boardKey(o.board)===UI.fBoard);
  if(UI.sortOrder){
    const pos = new Map(UI.sortOrder.map((id,i)=>[id,i]));
    list.sort((a,b)=> (pos.has(a.id)?pos.get(a.id):1e9+S.observations.indexOf(a)) - (pos.has(b.id)?pos.get(b.id):1e9+S.observations.indexOf(b)));
  }
  return list;
}
function applySort(col, A){
  if(UI.sortCol===col){ UI.sortDir = UI.sortDir===1? -1 : (UI.sortDir===-1? 0 : 1); } else { UI.sortCol=col; UI.sortDir=1; }
  if(UI.sortDir===0){ UI.sortCol=null; UI.sortOrder=null; return; }
  const arr = S.observations.slice();
  arr.sort((a,b)=>{
    const va=obsSortVal(a,col,A), vb=obsSortVal(b,col,A);
    if(va==null && vb==null) return 0; if(va==null) return 1; if(vb==null) return -1;
    if(typeof va==="string") return va.localeCompare(vb, undefined, {numeric:true})*UI.sortDir;
    return (va-vb)*UI.sortDir;
  });
  UI.sortOrder = arr.map(o=>o.id);
}

  h += `<div class="add-row"><button class="btn" data-act="obsAdd">+ Add observation</button><button class="btn subtle" data-act="obsAddBoard">+ Add rows for a board</button><button class="btn subtle" data-act="paste">Paste from spreadsheet</button>
    <span class="small muted">Tip: press Enter to move down a column. New rows copy the date, board, batch and crew of the last row and pick the next operation.</span></div>`;
  h += slot("timeSummary", timeSummary);
  return h;
}
const COL_HELP = {

  if(UI.group==="op") arr.sort((a,b)=> S.operations.findIndex(x=>opLabel(x)===a.label) - S.operations.findIndex(x=>opLabel(x)===b.label));

/* ---------- MOTION & EFFICIENCY ---------- */
function motionByOp(){
  const by = new Map();
  S.motions.forEach(m=>{
    if(!m.opId) return;
    if(!by.has(m.opId)) by.set(m.opId, {total:0, va:0, by:{}, steps:0, timed:0, nva:0, high:0, ineff:[]});
    const x = by.get(m.opId); x.steps++;
    if(m.effort==="High") x.high++;
    if(m.inefficiency) x.ineff.push(m.inefficiency);
    if(m.cls!=="va") x.nva++;
    if(isNum(m.duration)){ const t=m.duration*(m.reps||1); x.timed++; x.total+=t; x.by[m.cls]=(x.by[m.cls]||0)+t; if(m.cls==="va") x.va+=t; }
  });
  return by;
}

const FINDINGS = [
  ["bottlenecks", "Major bottlenecks", "Which operations consume the most labor or could constrain production?"],
  ["inefficiencies", "Process inefficiencies", "Where do unnecessary movement, repeated handling, delays or rework occur?"],
  ["improvements", "Improvement opportunities", "What changes could reduce labor or improve consistency?"],
