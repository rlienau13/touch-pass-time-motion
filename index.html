<style>
  :root{
    color-scheme: light;
    --ink:#1c1c1c; --muted:#6b6b6b; --faint:#9a9a95; --line:#e4e4e4; --paper:#fbfbfa; --card:#ffffff;
    --teal:#1f9e8a; --orange:#d97a1f; --purple:#6452c9; --rose:#b5556f; --blue:#2563b0; --slate:#64748b; --gold:#b8860b; --good:#1f9e6b;
    --warn:#8a6508; --warn-bg:#fff8e6;
    --m-mfr:#2563b0; --m-proto:#1c1c1c;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;}
  .container{max-width:1280px; margin:0 auto; padding:30px 32px 70px;}

  h1{font-size:25px; font-weight:800; margin:0; letter-spacing:-.01em;}
  h2{font-size:19px; font-weight:800; margin:76px 0 8px;}
  h3{font-size:14.5px; font-weight:800; margin:0 0 4px; display:flex; align-items:center; gap:8px;}
  .subtitle{font-size:13px; color:var(--muted); margin:0 0 16px; line-height:1.5;}
  .muted{color:var(--muted);} .small{font-size:11.5px;}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0;}

  .btn{font-family:inherit; font-size:12.5px; font-weight:700; padding:8px 14px; border-radius:6px; border:1px solid var(--ink); background:#fff; color:var(--ink); cursor:pointer; white-space:nowrap;}
  .btn:hover{background:var(--ink); color:#fff;}
  .btn.primary{background:var(--ink); color:#fff;}
  .btn.subtle{font-size:12px; padding:6px 12px; border-color:var(--line); color:var(--muted); font-weight:600;}
  .btn.subtle:hover{background:var(--line); color:var(--ink); border-color:var(--line);}
  .btn.danger-ish:hover{background:var(--rose); border-color:var(--rose); color:#fff;}
  .btn:disabled{opacity:.45; cursor:default;}
  .btn-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}

  /* Toolbar (same pattern as Roadmap / BOM) */
  .toolbar{display:flex; align-items:center; justify-content:flex-end; gap:10px; margin-bottom:22px; flex-wrap:wrap;}
  .save-status{font-size:11px; color:var(--muted); margin-right:auto; display:flex; align-items:center; gap:6px;}
  .save-status .pending, .save-status .clean{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--orange);}
  .save-status .clean{background:var(--good);}

  .eyebrow{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:6px;}
  .doc-meta{display:flex; gap:20px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:8px; align-items:center;}
  .doc-meta b{color:var(--ink);}
  .doc-meta .ci{display:inline-block; width:auto; font-size:12px;}
  .ci.title-in{font-size:25px; font-weight:800; letter-spacing:-.01em; padding:2px 6px; margin-left:-7px; width:100%;}
  .ci.sub-in{font-size:13px; color:var(--muted); margin-left:-6px;}
  .doc-sub{font-size:13px; color:var(--muted); margin-top:4px;}

  /* Summary cards (BOM summary-card style) */
  .summary-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(210px,1fr)); gap:12px; margin-top:40px;}
  .summary-card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; min-width:0;}
  .summary-card .lbl{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:8px; display:flex; align-items:center; gap:7px;}
  .summary-card .big{font-size:22px; font-weight:800; line-height:1.15; font-variant-numeric:tabular-nums;}
  .summary-card .big.txt{font-size:16px;}
  .summary-card .unit{font-size:11px; font-weight:700; color:var(--muted);}
  .summary-card .sub{font-size:11.5px; color:var(--muted); margin-top:5px; line-height:1.4;}
  .summary-card.dark{background:var(--ink); border-color:var(--ink);}
  .summary-card.dark .lbl, .summary-card.dark .big, .summary-card.dark .sub, .summary-card.dark .unit{color:#fff;}
  .summary-card.dark .sub{color:rgba(255,255,255,.75);}
  .warnline{color:var(--warn);}

  .tag{display:inline-block; font-size:9.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; padding:2px 7px; border-radius:999px; white-space:nowrap; line-height:1.4; vertical-align:1px;}
  .t-partial{border:1px solid #e6c46a; color:var(--warn); background:var(--warn-bg);}
  .t-done{border:1px solid var(--good); color:#0f6b47; background:#effaf5;}
  .t-none{border:1px solid var(--line); color:var(--muted); background:#fff;}

  .legend{display:flex; gap:14px; flex-wrap:wrap; margin:8px 0 0; font-size:11.5px; color:var(--muted); align-items:center;}
  .legend .sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
  .sw.hatch{background:repeating-linear-gradient(135deg,#cfcfca 0,#cfcfca 2px,#fff 2px,#fff 5px) !important; border:1px solid #cfcfca;}

  /* Conversions panel */
  .conv{display:flex; flex-wrap:wrap; gap:8px 22px; align-items:center; background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin:0 0 12px; font-size:12px;}
  .conv .conv-title{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);}
  .conv label{display:flex; align-items:center; gap:7px; color:var(--muted);}
  .conv .ci{width:58px; border-color:var(--line); background:#fff; text-align:right;}
  .conv .ro{display:inline; font-weight:700; color:var(--ink); padding:0;}
  .conv .missing{color:var(--warn); font-weight:700;}

  /* Study table */
  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:8px; background:#fff;}
  table.study{border-collapse:separate; border-spacing:0; width:100%; font-size:12.5px; table-layout:fixed; min-width:900px;}
  table.study th, table.study td{padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:middle; text-align:left;}
  table.study thead th{background:#f6f6f5; font-size:10.3px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); font-weight:800; border-bottom:2px solid var(--ink); position:sticky; top:0; z-index:2;}
  table.study thead th .u{font-weight:600; text-transform:none; letter-spacing:0; color:var(--faint);}
  table.study th.num, table.study td.num{text-align:right; font-variant-numeric:tabular-nums;}
  table.study th.calc-h{background:#f0f0ee;}
  table.study td.calc{font-weight:700; text-align:right; font-variant-numeric:tabular-nums;}
  table.study td.sec-total{font-size:15px; font-weight:800; vertical-align:middle; text-align:center;}
  .ex-tag{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--faint); text-align:right; padding:0 6px 2px;}
  table.study tr.excluded td:not(.calc):not(.actions) .ci, table.study tr.excluded td:not(.calc) .ro{color:var(--faint);}
  table.study tr.excluded td .ci.num, table.study tr.excluded td .ro.num{text-decoration:line-through;}
  .ex-opt{display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px; cursor:pointer; font-size:13px; line-height:1.4;}
  .ex-opt:hover{border-color:var(--ink);}
  .ex-opt input{margin-top:3px; accent-color:var(--ink);}
  .conv-warn{font-size:10.5px; font-weight:600; color:var(--warn); text-align:right; padding:0 6px 2px;}
  table.study td.calc .hint-x{font-weight:500; color:var(--faint); font-size:10.5px; margin-left:3px;}
  table.study tr.m-mfr td{background-color:#f4f4f2;}
  table.study tbody tr.op:hover td{background-color:#efefec;}
  table.study tbody tr.op:hover td.calc{filter:brightness(.98);}
  table.study td.stage-cell{vertical-align:top; padding:12px 12px; border-bottom:none; border-right:1px solid var(--line);}
  table.study tbody.stage-body tr.first td{border-top:2px solid var(--ink);}
  table.study tbody.stage-body:first-of-type tr.first td{border-top:none;}
  .stage-name{font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; line-height:1.3; overflow-wrap:anywhere;}
  textarea.ci.stage-name{font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 5px; margin:-3px -5px 0; width:calc(100% + 10px); background:transparent; border-color:transparent;}
  textarea.ci.stage-name:hover{border-color:rgba(255,255,255,.6); background:rgba(255,255,255,.15);}
  textarea.ci.stage-name:focus{background:#fff; color:var(--ink) !important; border-color:var(--ink);}
  .stage-tools{margin-top:10px; display:flex; flex-direction:column; gap:6px; align-items:flex-start;}
  .stage-btns{background:rgba(255,255,255,.85); border-radius:5px; display:inline-flex;}
  .swatches{display:inline-flex; gap:3px; background:rgba(255,255,255,.85); border-radius:5px; padding:3px;}
  .swatch{width:14px; height:14px; border-radius:4px; border:2px solid #fff; box-shadow:0 0 0 1px var(--line); cursor:pointer; padding:0;}
  .swatch.on{box-shadow:0 0 0 2px var(--ink);}
  table.study tr.method-row td{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:6px 10px;}
  table.study tr.method-row td .mt{float:right; text-transform:none; letter-spacing:0; font-weight:600;}
  table.study tr.method-row td .mt b{color:var(--ink); font-variant-numeric:tabular-nums;}
  table.study tr.add td{padding:4px 8px 8px;}
  table.study td.opcell{border-left:4px solid transparent;}
  table.study td.notes .ci, table.study td.notes .ro{color:var(--muted); font-size:11.8px;}
  table.study td.actions{white-space:nowrap; text-align:right;}
  table.study tr.total-row td{border-top:2px solid var(--ink); background:#fafaf9; font-weight:800;}

  /* Inline-editable cells */
  .ci{width:100%; min-width:0; font-family:inherit; font-size:12.5px; color:var(--ink); background:transparent; border:1px solid transparent; border-radius:4px; padding:4px 6px; line-height:1.35;}
  .ci:hover{border-color:var(--line); background:#fff;}
  .ci:focus{outline:none; border-color:var(--ink); background:#fff; box-shadow:0 0 0 2px rgba(28,28,28,.08);}
  .ci.num{text-align:right; font-variant-numeric:tabular-nums;}
  .ci.bad{border-color:var(--rose); background:#fdf2f4;}
  .ci::placeholder{color:#c4c4c0;}
  textarea.ci{resize:none; overflow:hidden; display:block;}
  select.ci{cursor:pointer;}
  .ro{display:block; padding:4px 6px; overflow-wrap:anywhere; white-space:pre-wrap;}
  .ro.num{text-align:right; font-variant-numeric:tabular-nums;}
  .blank{color:#c4c4c0;}
  .unk{color:var(--muted); font-style:italic;}

  .icon-btn{border:none; background:none; cursor:pointer; font-size:13px; padding:3px 5px; border-radius:4px; color:var(--muted); line-height:1;}
  .icon-btn:hover{background:var(--line); color:var(--ink);}
  .icon-btn:disabled{opacity:.3; cursor:default; background:none;}
  .link-btn{font-family:inherit; font-size:12px; font-weight:700; color:var(--muted); background:none; border:none; cursor:pointer; padding:4px 6px; border-radius:4px;}
  .link-btn:hover{color:var(--ink); background:var(--line);}

  /* Totals */
  table.tot{border-collapse:separate; border-spacing:0; width:100%; font-size:12.5px; background:#fff;}
  table.tot th, table.tot td{padding:8px 10px; border-bottom:1px solid var(--line); text-align:left;}
  table.tot thead th{background:#f6f6f5; font-size:10.3px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); font-weight:800; border-bottom:2px solid var(--ink);}
  table.tot td.num, table.tot th.num{text-align:right; font-variant-numeric:tabular-nums;}
  table.tot td .cov{display:block; font-size:10.5px; color:var(--muted); font-weight:500;}
  table.tot tr.total-row td{border-top:2px solid var(--ink); font-weight:800; background:#fafaf9;}
  .diff-faster{color:#0f6b47;} .diff-slower{color:#9b3a55;}

  /* Charts */
  .grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px;}
  @media (max-width:980px){ .grid2{grid-template-columns:1fr;} }
  .card{background:#fff; border:1px solid var(--line); border-radius:10px; padding:16px 18px;}
  .card-note{font-size:11.5px; color:var(--muted); line-height:1.5; margin:2px 0 10px;}
  .chart{width:100%; min-height:40px;}
  .chart svg{display:block; width:100%; height:auto; overflow:visible;}
  .chart text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;}
  .chart .lbl{font-size:11.5px; fill:var(--ink);} .chart .lbl.strong{font-weight:700;}
  .chart .val{font-size:11px; fill:var(--muted); font-variant-numeric:tabular-nums;}
  .chart .val.strong{fill:var(--ink); font-weight:700;}
  .chart .axis{font-size:10px; fill:var(--faint); font-variant-numeric:tabular-nums;}
  .chart .gridline{stroke:#efefed;} .chart .baseline{stroke:#cfcfca;}
  .chart .hit:hover .mark{filter:brightness(1.12);}
  .chart-empty{font-size:12px; color:var(--muted); padding:26px 10px; text-align:center; border:1.5px dashed var(--line); border-radius:8px;}

  /* Improvements */
  .imp-list{display:flex; flex-direction:column; gap:8px;}
  .imp{display:grid; grid-template-columns:190px minmax(0,1fr) auto; gap:10px; align-items:start; background:#fff; border:1px solid var(--line); border-left:4px solid var(--line); border-radius:8px; padding:8px 10px;}
  .imp .stage-pill{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; padding:5px 6px;}
  .imp .ci{font-size:13px; line-height:1.5;}
  .imp .ro{font-size:13px; line-height:1.5;}
  .imp select.ci{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.03em;}

  /* Publish panel */
  .publish{margin-top:76px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px 20px;}
  .publish ol{margin:8px 0 12px; padding-left:20px; font-size:12.5px; line-height:1.65;}
  .publish h4{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:16px 0 8px;}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; background:#f3f3f1; padding:1px 5px; border-radius:4px;}
  .hint{font-size:11px; color:var(--muted); margin-top:6px; line-height:1.45;}

  .notice{border:1px solid #ecd9a6; background:var(--warn-bg); color:#5e4708; border-radius:8px; padding:10px 14px; font-size:12.5px; line-height:1.5; margin:0 0 14px;}
  .notice.info{border-color:var(--line); background:#fff; color:var(--ink);}
  .notice .btn{margin-left:8px;}

  footer{margin-top:50px; padding-top:16px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); font-style:italic;}

  /* Modal (same as Roadmap / BOM) */
  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .modal-overlay.open{display:flex;}
  .modal{background:#fff; border-radius:10px; width:100%; max-width:560px; max-height:88vh; overflow-y:auto; padding:24px 26px; box-shadow:0 12px 40px rgba(0,0,0,.25);}
  .modal h3{margin:0 0 14px; font-size:16px;}
  .modal p{font-size:13px; line-height:1.6;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}

  #tip{position:fixed; z-index:80; pointer-events:none; background:var(--ink); color:#fff; font-size:11.5px; line-height:1.45; padding:7px 10px; border-radius:6px; max-width:300px; white-space:pre-line; display:none;}
  #toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:90; background:var(--ink); color:#fff; font-size:12.5px; padding:10px 16px; border-radius:8px; display:none; align-items:center; gap:12px; box-shadow:0 8px 24px rgba(0,0,0,.25); max-width:90vw;}
  #toast.open{display:flex;}
  #toast button{font-family:inherit; font-size:12px; font-weight:800; background:none; border:1px solid rgba(255,255,255,.5); color:#fff; padding:4px 10px; border-radius:5px; cursor:pointer;}
  .preview-pill{position:fixed; right:22px; bottom:22px; z-index:60; display:none;}
  body.previewing .preview-pill{display:block;}

  /* View-only mode: hide editing affordances entirely */
  .view-only .edit-only{display:none !important;}
  .view-only .icon-btn{display:none;}
  html:not(.view-only) .view-only-show{display:none !important;}

  @media print{
    @page{margin:14mm 12mm;}
    body{background:#fff;}
    .container{padding:0; max-width:none;}
    .toolbar, #banner, .edit-only, .no-print, #toast, #tip, .preview-pill{display:none !important;}
    .table-wrap{overflow:visible; border-color:#ddd;}
    table.study{min-width:0;}
    table.study thead th{position:static;}
    tr, .card, .summary-card, .imp{break-inside:avoid; page-break-inside:avoid;}
    h2{break-after:avoid; page-break-after:avoid;}
    *{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
  }
</style>
</head>

function fmtDay(ms){ return ms ? new Date(ms).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}) : "—"; }

/* ---------- time: stored as decimal minutes, shown as m:ss ----------
   Inputs accept 10:00 (m:ss), 1:05:30 (h:mm:ss), 10 (minutes), 45s, 2m 30s, 1.5h,
   and "Unknown" / "?" for a step whose time isn't known yet.                    */
function parseTime(raw){
  let s = String(raw==null?"":raw).trim().toLowerCase().replace(/,/g,".");
  if(s==="") return {ok:true, val:null, unknown:false};
  if(/^(unknown|unk|\?|tbd|n\/a)$/.test(s)) return {ok:true, val:null, unknown:true};
  let m = s.match(/^(\d+):([0-5]?\d(?:\.\d+)?)$/);
  if(m) return {ok:true, val:+m[1] + (+m[2])/60};
  m = s.match(/^(\d+):([0-5]\d):([0-5]\d(?:\.\d+)?)$/);
  if(m) return {ok:true, val:(+m[1])*60 + (+m[2]) + (+m[3])/60};
  if(/^\d*\.?\d+$/.test(s)) return {ok:true, val:parseFloat(s)};
  m = s.match(/^(?:(\d*\.?\d+)\s*h(?:rs?|ours?)?)?\s*(?:(\d*\.?\d+)\s*m(?:in(?:s|utes?)?)?)?\s*(?:(\d*\.?\d+)\s*s(?:ecs?|econds?)?)?$/);
  if(m && (m[1]||m[2]||m[3])) return {ok:true, val:(+m[1]||0)*60 + (+m[2]||0) + (+m[3]||0)/60};
  return {ok:false};
}
function mss(v){
  if(!isNum(v)) return "";
  let sec = Math.round(v*60);
  const h = Math.floor(sec/3600); sec -= h*3600;
  const m = Math.floor(sec/60), s = sec - m*60;
  return h ? h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0") : m+":"+String(s).padStart(2,"0");
}
function parseNum(raw){
  const s = String(raw==null?"":raw).trim().replace(/[,\s]/g,"");
  if(s==="") return {ok:true, val:null};
  if(!/^\d*\.?\d+$/.test(s)) return {ok:false};
  const v = parseFloat(s); if(!(v>0)) return {ok:false};
  return {ok:true, val:v};
}
function fmtFactor(f){ if(!isNum(f)) return ""; if(f===1) return ""; if(f>1) return "× "+(Math.round(f*100)/100); return "÷ "+(Math.round(100/f)/100); }

/* ---------- validation of loaded / imported data ---------- */
function str(v,max){ return v==null ? "" : String(v).slice(0, max||MAX_TEXT); }
function pos(v){ if(v===null||v===undefined||v==="") return null; const n=Number(v); return (isFinite(n) && n>0) ? n : null; }
function nonneg(v){ if(v===null||v===undefined||v==="") return null; const n=Number(v); return (isFinite(n) && n>=0) ? n : null; }
function normalizeState(raw){
  if(!raw || typeof raw!=="object" || Array.isArray(raw)) throw new Error("The file doesn't contain a study.");
  if(raw.schema!==SCHEMA){
    if(raw.schema==="touchpass-time-motion") throw new Error("This backup is from the earlier multi-tab version of the tool, which used a different layout. It can't be loaded into this version.");
    throw new Error("This file isn't a Touch Pass time study backup.");
  }
  const t = makeTemplate();
  const s = {schema:SCHEMA, version:SCHEMA_VERSION};
  const rm = raw.meta||{};
  s.meta = {title:str(rm.title,200)||t.meta.title, subtitle:str(rm.subtitle,300), preparedBy:str(rm.preparedBy,120), updatedAt:Number(rm.updatedAt)||0, exportedAt:Number(rm.exportedAt)||0};
  const rmeth = Array.isArray(raw.methods)? raw.methods : [];
  s.methods = t.methods.map(m=>{ const f=rmeth.find(x=>x&&x.id===m.id); return {id:m.id, name: (f && str(f.name,60).trim()) || m.name}; });
  const rc = raw.conv||{};
  s.conv = {partsPerBoard:pos(rc.partsPerBoard), boardsPerSheet:pos(rc.boardsPerSheet), partsPerLoad:pos(rc.partsPerLoad), boardsPerBatch:pos(rc.boardsPerBatch)};
  const seen = new Set();
  const fixId = (id,p)=>{ let x=str(id,40)||uid(p); while(seen.has(x)) x=uid(p); seen.add(x); return x; };
  s.stages = (Array.isArray(raw.stages)? raw.stages : []).filter(x=>x&&typeof x==="object").map(st=>({
    id:fixId(st.id,"st"), name:str(st.name,80)||"Stage", color: PALETTE.includes(st.color)? st.color : PALETTE[0],
    ops:(Array.isArray(st.ops)? st.ops : []).filter(o=>o&&typeof o==="object").map(o=>({
      id:fixId(o.id,"op"), method: o.method==="mfr"?"mfr":"proto", name:str(o.name,300), notes:str(o.notes,1000),
      freq: FREQ[o.freq]? o.freq : "board", time:nonneg(o.time), unknown: !!o.unknown && nonneg(o.time)==null,
      exclude: ["all","headline"].includes(o.exclude)? o.exclude : "" }))
  }));
  const stIds = new Set(s.stages.map(x=>x.id));
  s.improvements = (Array.isArray(raw.improvements)? raw.improvements : []).filter(x=>x&&typeof x==="object").map(i=>({
    id:fixId(i.id,"im"), stageId: stIds.has(i.stageId)? i.stageId : "", text:str(i.text,2000)}));

}
function contentSig(st){ const c=Object.assign({}, st, {meta:Object.assign({}, st.meta, {updatedAt:0, exportedAt:0})}); return hashStr(JSON.stringify(c)); }

/* =====================================================================
   Calculations
   Per-board time = recorded time × how many times that step happens per board:
     per board ×1 · per part × parts per board · per sheet ÷ boards per sheet
     per oven load × (parts per board ÷ parts per oven load) · per batch ÷ boards per batch
   A step with no time (or "Unknown") isn't timed yet and is left out of totals,
   and every total says how many of its steps are timed.
   ===================================================================== */
function factorFor(freq){
  const c = S.conv;
  switch(freq){
    case "board": return {f:1};
    case "part":  return c.partsPerBoard ? {f:c.partsPerBoard} : {f:null, need:"parts per board"};
    case "sheet": return c.boardsPerSheet ? {f:1/c.boardsPerSheet} : {f:null, need:"boards per sheet"};
    case "load":  return (c.partsPerBoard && c.partsPerLoad) ? {f:c.partsPerBoard/c.partsPerLoad} : {f:null, need: c.partsPerBoard? "parts per oven load" : "parts per board"};
    case "batch": return c.boardsPerBatch ? {f:1/c.boardsPerBatch} : {f:null, need:"boards per batch"};
  }
  return {f:null, need:"a frequency"};
}
function opCalc(o){
  const fc = factorFor(o.freq);
  const timed = isNum(o.time);
  return {timed, factor:fc.f, need:fc.need, perBoard: (timed && isNum(fc.f)) ? o.time*fc.f : null, counted: timed && isNum(fc.f)};
}
// Steps marked "exclude from all totals" are left out entirely (they don't count as untimed either).
// Steps marked "exclude from headline" count everywhere except the per-board cards at the top.
function groupStats(allOps){
  const ops = allOps.filter(o=>o.exclude!=="all");
  const n = ops.length, cs = ops.map(opCalc);
  const timed = cs.filter(c=>c.timed).length, counted = cs.filter(c=>c.counted).length;
  const needConv = cs.filter(c=>c.timed && !c.counted).length;
  const total = counted? sum(cs.map(c=>c.perBoard)) : null;
  const headOut = sum(ops.map((o,i)=> o.exclude==="headline" && cs[i].counted ? cs[i].perBoard : null));
  return {n, timed, counted, needConv, total, headline: isNum(total)? total-headOut : null,
    headExcluded: ops.filter(o=>o.exclude==="headline").length, complete: n>0 && counted===n};
}
function analyze(){
  const A = {stages:[], methods:{}};
  S.methods.forEach(m=>A.methods[m.id] = {n:0, timed:0, counted:0, needConv:0, total:0, headline:0, headExcluded:0, anyData:false, complete:true, stagesWith:0});
  S.stages.forEach(st=>{
    const row = {st, by:{}};
    S.methods.forEach(m=>{
      const g = groupStats(st.ops.filter(o=>o.method===m.id));
      row.by[m.id] = g;
      const M = A.methods[m.id];
      if(g.n){ M.stagesWith++; M.n+=g.n; M.timed+=g.timed; M.counted+=g.counted; M.needConv+=g.needConv; M.headExcluded+=g.headExcluded; if(isNum(g.total)){ M.total+=g.total; M.headline+=g.headline; M.anyData=true; } if(!g.complete) M.complete=false; }
    });
    const a=row.by.mfr, b=row.by.proto;
    row.diff = (a.complete && b.complete) ? a.total - b.total : null;
    A.stages.push(row);
  });
  S.methods.forEach(m=>{ const M=A.methods[m.id]; if(!M.n) M.complete=false; if(!M.anyData){ M.total=null; M.headline=null; } });
  const P=A.methods.proto, F=A.methods.mfr;
  A.totalDiff = (P.complete && F.complete) ? F.total - P.total : null;
  A.headDiff = (P.complete && F.complete) ? F.headline - P.headline : null;
  A.comparable = A.stages.filter(r=>isNum(r.diff)).length;
  const withP = A.stages.filter(r=>isNum(r.by.proto.total));
  A.longestProto = withP.sort((x,y)=>y.by.proto.total-x.by.proto.total)[0] || null;
  return A;
}

let S = null;
let UI = {preview:false, printing:false};
let D = {};       // derived slots: data-d="key" -> fn(A)
let CHARTS = {};
function isLockedView(){ return document.documentElement.classList.contains("view-only") && !UI.preview; }
function isView(){ return document.documentElement.classList.contains("view-only") || UI.preview || UI.printing; }
function slot(key, fn, tag, cls){ D[key]=fn; tag=tag||"div"; return `<${tag} data-d="${esc(key)}"${cls?` class="${cls}"`:""}></${tag}>`; }
function methodName(id){ const m=S.methods.find(x=>x.id===id); return m? m.name : id; }

function roText(v, cls){ return `<span class="ro ${cls||""}">${v!==""&&v!=null? esc(v) : '<span class="blank">—</span>'}</span>`; }
function inText(b, v, ph, cls){

function inArea(b, v, ph, cls){

function inTime(b, o){

  return `<input type="text" class="ci num${o.unknown?" unk":""}" data-b="${esc(b)}" data-k="time" value="${esc(v)}" placeholder="m:ss" inputmode="decimal" autocomplete="off" spellcheck="false">`;
}
function inNum(b, v, ph){

  return `<input type="text" class="ci num" data-b="${esc(b)}" data-k="num" value="${isNum(v)? esc(String(v)) : ""}" placeholder="${esc(ph||"")}" inputmode="decimal" autocomplete="off">`;
}
function inSel(b, v, opts, cls){
  if(isView()){ const o=opts.find(x=>x[0]===v); return roText(o? o[1] : "", cls); }
  return `<select class="ci ${cls||""}" data-b="${esc(b)}" data-k="sel">${opts.map(o=>`<option value="${esc(o[0])}"${o[0]===v?" selected":""}>${esc(o[1])}</option>`).join("")}</select>`;

function iconBtns(list){ return list.map(x=>`<button type="button" class="icon-btn" data-act="${x[0]}" data-id="${esc(x[1])}" title="${esc(x[2])}"${x[4]?" disabled":""}>${x[3]}</button>`).join(""); }
// Pick ink or white text for a saturated background, whichever reads better
function textOn(hex){
  const n=parseInt(hex.slice(1),16), ch=[(n>>16)&255,(n>>8)&255,n&255].map(v=>{ v/=255; return v<=0.03928? v/12.92 : Math.pow((v+0.055)/1.055,2.4); });
  const L=0.2126*ch[0]+0.7152*ch[1]+0.0722*ch[2];
  return (1.05/(L+0.05)) >= ((L+0.05)/(0.0174+0.05)) ? "#ffffff" : "#1c1c1c";
}
function tStr(v){ return isNum(v)? mss(v) : "—"; }
function cov(g){ return g.n ? `${g.timed} of ${g.n} timed` : "no steps"; }
function statusTag(g){ if(!g.n) return ""; if(g.complete) return `<span class="tag t-done">Complete</span>`; return g.timed? `<span class="tag t-partial">Partial</span>` : `<span class="tag t-none">Not timed</span>`; }

      <span class="stage-btns">${iconBtns([["stUp",st.id,"Move stage up","↑",si===0],["stDown",st.id,"Move stage down","↓",si===S.stages.length-1],["stDel",st.id,"Delete stage","🗑"]])}</span></div>`}</td>`;
    h += `<tbody class="stage-body">`;

    S.methods.forEach(m=>{

        if(oi===0) D["sec|"+st.id+"|"+m.id] = A2=>{ const r=A2.stages.find(x=>x.st.id===st.id); const g=r&&r.by[m.id]; return g && isNum(g.total)? esc(mss(g.total)) : `<span class="blank">—</span>`; };

    <div class="card"><h3>Where the time goes</h3><div class="card-note">Total per board for each process, split by stage.</div>${chartBox("stack", stackChart)}

    const col = st? st.color : "#cfcfca";
    h += `<div class="imp" style="border-left-color:${col}"><div>${isView()? `<span class="ro stage-pill" style="color:${col}">${esc(st? st.name : "General")}</span>` : inSel("imp|"+im.id+"|stageId", im.stageId, [["","General"], ...S.stages.map(s=>[s.id, s.name])])}</div>
      <div>${inArea("imp|"+im.id+"|text", im.text, "Suggestion or observation")}</div>
      <div class="edit-only">${iconBtns([["impDel",im.id,"Delete","🗑"]])}</div></div>`;
  });
  h += `</div><div class="btn-row edit-only" style="margin-top:10px"><button class="btn subtle" data-act="impAdd">+ Add suggestion</button></div>`;

  // ----- publishing (edit mode only) -----
  if(!isView()) h += publishHtml();

function convHtml(){
  const c = S.conv;
  const used = new Set(); S.stages.forEach(st=>st.ops.forEach(o=>used.add(o.freq)));
  const item = (key, label, ph, freqs)=> (freqs.some(f=>used.has(f)) || isNum(c[key])) ? `<label>${label} ${inNum("conv|"+key, c[key], ph)}</label>` : "";
  return `<div class="conv"><span class="conv-title">Frequency conversions</span>
    ${item("partsPerBoard","Parts per board","3",["part","load"])}
    ${item("boardsPerSheet","Boards per sheet","4",["sheet"])}
    ${item("partsPerLoad","Parts per oven load","—",["load"])}
    ${item("boardsPerBatch","Boards per batch","—",["batch"])}
    <span class="small muted edit-only" style="flex-basis:100%">Parts per board = top panel, back leg, front leg. Boards per sheet comes from the BOM (2 sheets → 8 boards). Leave a value blank until you know it; steps that need it are flagged and left out of totals.</span></div>`;
}

function summaryHtml(A){
  const card = (label, dot, big, sub, cls)=>`<div class="summary-card ${cls||""}"><div class="lbl">${dot? `<span class="dot" style="background:${dot};width:8px;height:8px"></span>`:""}${label}</div><div class="big${/txt/.test(cls||"")?" txt":""}">${big}</div><div class="sub">${sub}</div></div>`;
  const P = A.methods.proto, F = A.methods.mfr;
  const exNote = M=> M.headExcluded? ` · ${plural(M.headExcluded,"step")} not included` : "";
  const mSub = M=> M.n ? `${M.timed} of ${M.n} steps timed${exNote(M)}${M.needConv? ` · <span class="warnline">${M.needConv} ${M.needConv===1?"needs":"need"} a conversion</span>`:""}${M.complete? "" : (M.anyData? " · partial total" : "")}` : "No steps";
  let h = `<div class="summary-grid">`;
  h += card(esc(methodName("proto"))+" · per board", null, P.anyData? esc(mss(P.headline)) : "—", mSub(P), "dark");
  h += card(esc(methodName("mfr"))+" · per board", null, F.anyData? esc(mss(F.headline)) : "—", mSub(F)+" · 100% speculative");
  h += card("Difference per board", null, isNum(A.headDiff)? (A.headDiff<=0? "−" : "+")+esc(mss(Math.abs(A.headDiff))) : "—",
    isNum(A.headDiff)? `Manufacturer is ${A.headDiff<=0? "faster" : "slower"} than prototyping` : `Shown once both processes are fully timed${A.comparable? ` · ${plural(A.comparable,"stage")} comparable so far`:""}`);
  const L = A.longestProto;
  h += card("Longest prototyping stage", null, L? esc(L.st.name) : "—", L? `${esc(mss(L.by.proto.total))} per board · ${cov(L.by.proto)}` : "Enter prototyping times to see this", "txt");
  return h + `</div>`;
}

function totalsHtml(A){
  const P=S.methods.find(m=>m.id==="proto"), F=S.methods.find(m=>m.id==="mfr");
  const cell = g=> g.n ? `${isNum(g.total)? esc(mss(g.total)) : '<span class="blank">—</span>'}<span class="cov">${cov(g)}${g.needConv? ` · <span class="warnline">${g.needConv} need conversion</span>`:""}</span>` : '<span class="blank">no steps</span>';
  const diff = (d, why)=> isNum(d) ? `<b class="${d<=0?"diff-faster":"diff-slower"}">${d<=0?"−":"+"}${esc(mss(Math.abs(d)))}</b><span class="cov">${d<=0?"manufacturer faster":"manufacturer slower"}</span>` : `<span class="blank">—</span><span class="cov">${why}</span>`;
  let h = `<div class="table-wrap"><table class="tot"><thead><tr><th>Stage</th><th class="num">${esc(P.name)}</th><th class="num">${esc(F.name)}</th><th class="num">Difference</th></tr></thead><tbody>`;
  A.stages.forEach(r=>{
    const a=r.by.mfr, b=r.by.proto;
    const why = (!a.n||!b.n) ? "one process has no steps" : "needs both fully timed";
    h += `<tr><td><span class="dot" style="background:${r.st.color}"></span> <b>${esc(r.st.name)}</b></td><td class="num">${cell(b)}</td><td class="num">${cell(a)}</td><td class="num">${diff(r.diff, why)}</td></tr>`;
  });
  const Pm=A.methods.proto, Fm=A.methods.mfr;
  const totCell = M=> `${M.anyData? esc(mss(M.total)) : "—"}<span class="cov">${M.timed} of ${M.n} timed${M.complete? "" : M.anyData? " · partial" : ""}</span>`;
  h += `<tr class="total-row"><td>Total per board</td><td class="num">${totCell(Pm)}</td><td class="num">${totCell(Fm)}</td><td class="num">${diff(A.totalDiff, "needs both fully timed")}</td></tr>`;
  return h + `</tbody></table></div>`;
}

/* ---------- charts (SVG, no libraries) ---------- */
function chartBox(key, fn){ CHARTS[key]=fn; return `<div class="chart" data-chart="${key}"></div>`; }
function drawCharts(){
  $$(".chart[data-chart]").forEach(el=>{ const fn=CHARTS[el.dataset.chart]; if(!fn) return; const w=Math.max(300, Math.floor(el.clientWidth||560)); try{ el.innerHTML=fn(w, analyze()); }catch(e){ console.error(e); el.innerHTML=""; } });
}
function niceMax(v){ if(!(v>0)) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))), n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function barR(x,y,w,h,r){ if(w<=0) return ""; r=Math.min(r,w,h/2); return `M${x},${y} h${w-r} a${r},${r} 0 0 1 ${r},${r} v${h-2*r} a${r},${r} 0 0 1 ${-r},${r} h${-(w-r)} z`; }
const HATCH = `<defs><pattern id="hatchP" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#fff" stroke-width="2.2" stroke-opacity=".8"/></pattern></defs>`;
function axisTicks(max, x0, w, yTop, yBot){
  let s=""; for(let i=0;i<=4;i++){ const v=max*i/4, x=x0+w*i/4; s+=`<line class="gridline" x1="${x}" x2="${x}" y1="${yTop}" y2="${yBot}"/><text class="axis" x="${x}" y="${yBot+14}" text-anchor="middle">${esc(mss(v))}</text>`; } return s;
}
function stageChart(w, A){
  const rows = A.stages.filter(r=>S.methods.some(m=>isNum(r.by[m.id].total)));
  if(!rows.length) return `<div class="chart-empty">Enter times in the table to see this chart.</div>`;
  const lw = Math.min(170, w*0.32), vw = 74, gh = 46, bh = 13, pw = w-lw-vw;
  const max = niceMax(Math.max(...rows.flatMap(r=>S.methods.map(m=>r.by[m.id].total||0))));
  const h = rows.length*gh + 22;
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Time per board by stage">${HATCH}${axisTicks(max, lw, pw, 0, rows.length*gh)}`;
  rows.forEach((r,i)=>{
    const y0 = i*gh + 6;
    s += `<text class="lbl strong" x="${lw-10}" y="${y0+bh+1}" text-anchor="end" dominant-baseline="central">${esc(trunc(r.st.name, Math.floor(lw/7)))}</text>`;
    ["mfr","proto"].forEach((mid,j)=>{
      const g = r.by[mid], y = y0 + j*(bh+3);
      if(!g.n) return;
      const v = g.total||0, len = v>0 ? Math.max(2, v/max*pw) : 0;
      const tip = `${r.st.name} — ${methodName(mid)}\n${isNum(g.total)? mss(g.total)+" per board" : "No times yet"} · ${cov(g)}`;
      s += `<g class="hit" data-tip="${esc(tip)}"><rect x="${lw}" y="${y-1}" width="${pw}" height="${bh+2}" fill="transparent"/>`;
      if(len){ s += `<path class="mark" d="${barR(lw,y,len,bh,4)}" fill="${METHOD_COLORS[mid]}"/>`; if(!g.complete) s += `<path d="${barR(lw,y,len,bh,4)}" fill="url(#hatchP)"/>`; }
      s += `<text class="val" x="${lw+len+6}" y="${y+bh/2}" dominant-baseline="central">${isNum(g.total)? esc(mss(g.total)) : "—"}</text></g>`;
    });
  });
  return s + `<line class="baseline" x1="${lw}" x2="${lw}" y1="0" y2="${rows.length*gh}"/></svg>`;
}
function stackChart(w, A){
  const ms = S.methods.filter(m=>A.methods[m.id].anyData);
  if(!ms.length) return `<div class="chart-empty">Enter times in the table to see this chart.</div>`;
  const lw = Math.min(170, w*0.32), vw = 74, rh = 46, bh = 18, pw = w-lw-vw;
  const max = niceMax(Math.max(...ms.map(m=>A.methods[m.id].total)));
  const h = ms.length*rh + 22;
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Total per board by process and stage">${axisTicks(max, lw, pw, 0, ms.length*rh)}`;
  ms.forEach((m,i)=>{
    const y = i*rh + (rh-bh)/2, M = A.methods[m.id];
    s += `<text class="lbl strong" x="${lw-10}" y="${y+bh/2}" text-anchor="end" dominant-baseline="central">${esc(trunc(m.name, Math.floor(lw/7)))}</text>`;
    let x = lw;
    const segs = A.stages.filter(r=>isNum(r.by[m.id].total) && r.by[m.id].total>0);
    segs.forEach((r,j)=>{
      const v = r.by[m.id].total, len = v/max*pw, last = j===segs.length-1;
      const tip = `${m.name} — ${r.st.name}\n${mss(v)} per board (${Math.round(v/M.total*100)}% of total)\n${cov(r.by[m.id])}`;
      s += `<g class="hit" data-tip="${esc(tip)}">${last? `<path class="mark" d="${barR(x,y,Math.max(1,len),bh,4)}" fill="${r.st.color}"/>` : `<rect class="mark" x="${x}" y="${y}" width="${Math.max(1,len-2)}" height="${bh}" fill="${r.st.color}"/>`}</g>`;
      x += len;
    });
    s += `<text class="val strong" x="${x+6}" y="${y+bh/2}" dominant-baseline="central">${esc(mss(M.total))}${M.complete? "" : " *"}</text>`;
  });
  s += `<line class="baseline" x1="${lw}" x2="${lw}" y1="0" y2="${ms.length*rh}"/></svg>`;
  if(ms.some(m=>!A.methods[m.id].complete)) s += `<div class="small muted" style="margin-top:4px">* Partial — not every step is timed yet.</div>`;
  return s;
}

function publishHtml(){
  const dirty = contentSig(S)!==FILE_SIG;
  return `<div class="publish edit-only no-print"><h3>Save &amp; publish ${dirty? `<span class="tag t-partial">Changes not yet exported</span>` : `<span class="tag t-done">Matches this file</span>`}</h3>
    <ol><li>Edit on this page — changes save to this browser automatically.</li>
      <li>Click <b>Export HTML</b>. Your browser downloads <code>index.html</code> with the whole study built in (rename it if your Mac calls it <code>index (1).html</code>).</li>
      <li>In this tool's GitHub repository choose <i>Add file → Upload files</i>, drag in <code>index.html</code>, and commit. It replaces the previous version.</li>
      <li>Coworkers use your GitHub Pages link with <code>?view=1</code> on the end — a clean read-only page.</li></ol>
    <div class="btn-row"><button class="btn primary" data-act="exportHtml">Export HTML</button><button class="btn subtle" data-act="exportView">Export view-only HTML</button></div>
    <h4>Backup</h4><div class="btn-row"><button class="btn subtle" data-act="exportJson">Export JSON backup</button><button class="btn subtle" data-act="importJson">Import JSON…</button><button class="btn subtle" data-act="exportCsv">Export table as CSV</button>
      <span style="flex:1"></span><button class="btn subtle danger-ish" data-act="resetFile">Discard browser edits</button></div>
    <div class="hint">Browser autosave is a safety net, not a backup — it lives only in this browser. The exported HTML is the real copy: opening it on any computer shows the same study. When you open a file, the newer of the file's data and this browser's draft is shown, with a notice if they differ.</div></div>`;
}

function autosizeAll(){ $$("textarea.ci").forEach(autosize); }
function autosize(el){ el.style.height="auto"; el.style.height=(el.scrollHeight+2)+"px"; }

/* =====================================================================
   Persistence (same idea as Roadmap/BOM, plus newer-wins safety)
   ===================================================================== */
let FILE_STATE=null, FILE_SIG="", STORAGE_OK=false, LAST_SAVE=0, BANNER=null, EMBED_ERR=false, UNDO=[];
function testStorage(){ try{ const k="__tms_t"; localStorage.setItem(k,"1"); localStorage.removeItem(k); return true; }catch(e){ return false; } }
function loadInitial(){
  let embedded=null;
  try{ const raw=JSON.parse($("#tms-data").textContent.trim()||"null"); if(raw) embedded=normalizeState(raw); }catch(e){ console.error(e); EMBED_ERR=true; }
  FILE_STATE = embedded || makeTemplate();
  FILE_SIG = contentSig(FILE_STATE);
  if(document.documentElement.classList.contains("view-only")){ S=clone(FILE_STATE); return; }
  STORAGE_OK = testStorage();
  let draft=null;
  if(STORAGE_OK){ try{ const raw=localStorage.getItem(DRAFT_KEY); if(raw){ const d=JSON.parse(raw); draft={savedAt:Number(d.savedAt)||0, data:normalizeState(d.data)}; } }catch(e){ console.warn("Ignoring unreadable browser draft", e); } }
  if(draft && contentSig(draft.data)!==FILE_SIG){
    const fileT=FILE_STATE.meta.updatedAt||0, draftT=draft.data.meta.updatedAt||draft.savedAt||0;
    if(draftT>=fileT){ S=draft.data; BANNER={kind:"draft", t:draftT}; }
    else { S=clone(FILE_STATE); BANNER={kind:"olderDraft", t:draftT, draft:draft.data}; }
  } else S=clone(FILE_STATE);
  LAST_SAVE = draft? draft.savedAt : 0;
}
function saveDraft(){
  if(isView() || !STORAGE_OK) return;
  try{ localStorage.setItem(DRAFT_KEY, JSON.stringify({savedAt:Date.now(), data:S})); LAST_SAVE=Date.now(); }
  catch(e){ STORAGE_OK=false; toast("This browser stopped accepting automatic saves. Export HTML or JSON to keep your changes."); }
}
function commit(){ S.meta.updatedAt=Date.now(); saveDraft(); }
function pushUndo(){ UNDO.push(JSON.stringify(S)); if(UNDO.length>60) UNDO.shift(); }
function undo(){ if(!UNDO.length || isView()) return; S=JSON.parse(UNDO.pop()); commit(); render(); toast("Undone."); }
function updateSavedStamp(){
  const el=$("#savedStamp"); if(!el) return;
  if(isView()){ el.innerHTML = ""; return; }
  const dirty = contentSig(S)!==FILE_SIG;
  const saved = STORAGE_OK ? (LAST_SAVE? "Saved to this browser · "+esc(new Date(LAST_SAVE).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})) : "Autosaves to this browser") : `<b style="color:var(--warn)">⚠ Browser autosave unavailable — export to keep changes</b>`;
  el.innerHTML = saved + (dirty? ` · <span class="pending"></span> Changes not yet exported` : ` · <span class="clean"></span> Matches this file`);
}
function renderBanner(){
  const el=$("#banner"); let h="";
  if(!isView()){
    if(EMBED_ERR) h += `<div class="notice">This file's built-in study data couldn't be read, so the starting template was loaded. If you have a JSON backup, import it at the bottom of the page.</div>`;
    if(BANNER && !BANNER.dismissed){
      if(BANNER.kind==="draft") h += `<div class="notice info">Showing your edits saved in this browser (last change ${esc(fmtStamp(BANNER.t))}). They're newer than the data built into this file and haven't been exported yet.<button class="btn subtle" data-act="exportHtml">Export HTML</button><button class="btn subtle" data-act="useFile">Use this file's data instead</button><button class="btn subtle" data-act="dismissBanner">Dismiss</button></div>`;
      if(BANNER.kind==="olderDraft") h += `<div class="notice info">This file has newer data than the draft saved in this browser (draft from ${esc(fmtStamp(BANNER.t))}), so the file's data is shown.<button class="btn subtle" data-act="restoreDraft">Restore the browser draft</button><button class="btn subtle" data-act="dismissBanner">Dismiss</button></div>`;
    }
    if(!STORAGE_OK) h += `<div class="notice">This browser isn't allowing automatic saves for this file. Use <b>Export HTML</b> or a JSON backup before closing the tab.</div>`;
  }
  el.innerHTML = h;
}

/* ---------- export / import ---------- */
function download(content, name, type){
  const blob=new Blob([content],{type}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function safeJson(o){ return JSON.stringify(o).replace(/</g,"\\u003c").replace(/\u2028/g,"\\u2028").replace(/\u2029/g,"\\u2029"); }
function buildExportHtml(viewLock){
  const doc = document.documentElement.cloneNode(true);
  doc.classList.remove("view-only"); doc.classList.remove("view-locked");
  $$("[data-clear]", doc).forEach(el=>{ el.innerHTML=""; });
  const body = doc.querySelector("body"); body.className=""; body.removeAttribute("style");
  doc.querySelector("#modal").classList.remove("open");
  doc.querySelector("#tip").removeAttribute("style");
  doc.querySelector("#toast").className="";
  doc.querySelector("#tms-data").textContent = "\n"+safeJson(S)+"\n";
  return ("<!DOCTYPE html>\n"+doc.outerHTML).replace(/\/\*VIEW_LOCK\*\/(?:true|false)\/\*VIEW_LOCK_END\*\//, "/*VIEW_"+"LOCK*/"+(viewLock?"true":"false")+"/*VIEW_LOCK_"+"END*/");
}
function exportHtml(viewLock){
  closeModal();
  if(!S.meta.updatedAt) S.meta.updatedAt=Date.now();
  S.meta.exportedAt=Date.now();
  download(buildExportHtml(viewLock), viewLock? "index-view-only.html" : "index.html", "text/html");
  if(!viewLock){ FILE_SIG=contentSig(S); if(BANNER) BANNER.dismissed=true; }
  saveDraft(); render();
  toast(viewLock? "Downloaded a view-only copy (index-view-only.html)." : "Downloaded index.html — upload it to this tool's GitHub repo and commit to publish.", null, 7000);
}
function exportJson(){ const o=clone(S); o.backupCreatedAt=new Date().toISOString(); download(JSON.stringify(o,null,2), "touch-pass-time-study-"+todayStr()+".json", "application/json"); toast("JSON backup downloaded."); }
function csvCell(v){ if(v==null) return ""; let s=String(v); if(typeof v==="string" && /^[=+\-@\t\r]/.test(s)) s="'"+s; return /[",\n\r]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; }
function exportCsv(){
  const rows=[["Stage","Process","Operation","Notes","Frequency","Time (m:ss)","Time (min)","Per board (m:ss)","Per board (min)","Counted"]];
  S.stages.forEach(st=>S.methods.forEach(m=>st.ops.filter(o=>o.method===m.id).forEach(o=>{
    const c=opCalc(o);
    rows.push([st.name, m.name, o.name, o.notes, FREQ[o.freq].n, o.unknown? "Unknown" : mss(o.time), isNum(o.time)? Math.round(o.time*100)/100 : "", isNum(c.perBoard)? mss(c.perBoard) : "", isNum(c.perBoard)? Math.round(c.perBoard*100)/100 : "", o.exclude==="all"? "Not in totals" : o.exclude==="headline"? "Not in top total" : "Yes"]);
  })));
  download("\ufeff"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n"), "touch-pass-time-study-"+todayStr()+".csv", "text/csv");
}
let PENDING=null;
function importJsonFile(file){
  if(!file) return;
  if(file.size>10*1024*1024){ toast("That file is too large to be a study backup."); return; }
  const rd=new FileReader();
  rd.onload=()=>{
    let st;
    try{ st=normalizeState(JSON.parse(String(rd.result))); }
    catch(e){ openModal(`<h3>Can't import this file</h3><p>${esc(e instanceof SyntaxError? "It isn't valid JSON." : e.message)}</p><div class="modal-actions"><button class="btn" data-act="modalClose">OK</button></div>`); return; }
    PENDING=st;
    const nOps=sum(st.stages.map(x=>x.ops.length)), nT=sum(st.stages.map(x=>x.ops.filter(o=>isNum(o.time)).length));
    openModal(`<h3>Replace the current study?</h3><p>“${esc(file.name)}” has <b>${plural(st.stages.length,"stage")}</b>, <b>${plural(nOps,"step")}</b> (${nT} timed) and <b>${plural(st.improvements.length,"suggestion")}</b>${st.meta.updatedAt? ", last edited "+esc(fmtStamp(st.meta.updatedAt)) : ""}.</p><p>The current study on this page will be replaced. You can undo this until you leave the page.</p>
      <div class="modal-actions"><button class="btn subtle" data-act="modalClose">Cancel</button><button class="btn primary" data-act="importConfirm">Replace study</button></div>`);
  };
  rd.readAsText(file);
}

/* ---------- modal / toast / tooltip ---------- */
let CONFIRM_FN=null;
function openModal(html){ $("#modalBox").innerHTML=html; $("#modal").classList.add("open"); }
function closeModal(){ $("#modal").classList.remove("open"); $("#modalBox").innerHTML=""; PENDING=null; CONFIRM_FN=null; }
function confirmBox(title, msg, ok, fn){ CONFIRM_FN=fn; openModal(`<h3>${esc(title)}</h3><p>${msg}</p><div class="modal-actions"><button class="btn subtle" data-act="modalClose">Cancel</button><button class="btn primary" data-act="confirmOk">${esc(ok)}</button></div>`); }
let TOAST_T=null;
function toast(msg, action, ms){ const el=$("#toast"); el.innerHTML=`<span>${esc(msg)}</span>${action==="undo"? `<button data-act="undo">Undo</button>`:""}`; el.className="open"; clearTimeout(TOAST_T); TOAST_T=setTimeout(()=>{ el.className=""; }, ms||(action?6000:3200)); }
function showTip(e){
  const t=e.target.closest && e.target.closest("[data-tip]"), tip=$("#tip");
  if(!t){ tip.style.display="none"; return; }
  tip.textContent=t.getAttribute("data-tip"); tip.style.display="block";
  const r=tip.getBoundingClientRect(); let x=e.clientX+14, y=e.clientY+14;
  if(x+r.width>window.innerWidth-8) x=e.clientX-r.width-14; if(y+r.height>window.innerHeight-8) y=e.clientY-r.height-14;
  tip.style.left=x+"px"; tip.style.top=y+"px";
}

/* =====================================================================
   Edits
   ===================================================================== */
function findOp(id){ for(const st of S.stages){ const o=st.ops.find(x=>x.id===id); if(o) return {st, o}; } return null; }
function setField(parts, val, k){
  const coll = parts[0];
  if(coll==="meta"){ S.meta[parts[1]] = String(val||"").slice(0,300); return true; }
  if(coll==="conv"){ S.conv[parts[1]] = val; return true; }
  if(coll==="stage"){ const st=S.stages.find(s=>s.id===parts[1]); if(!st) return false; st.name = String(val).trim().slice(0,80)||"Stage"; return true; }
  if(coll==="op"){
    const f=findOp(parts[2]); if(!f) return false; const field=parts[3];
    if(field==="time"){ f.o.time=val.val; f.o.unknown=!!val.unknown; return true; }
    if(field==="freq"){ f.o.freq = FREQ[val]? val : "board"; return true; }
    f.o[field] = String(val).slice(0, field==="notes"?1000:300); return true;
  }
  if(coll==="imp"){ const im=S.improvements.find(x=>x.id===parts[1]); if(!im) return false; im[parts[2]] = String(val).slice(0,2000); return true; }
  return false;
}
function markBad(el,msg){ el.classList.add("bad"); el.title=msg; toast(msg); }
function moveIn(arr, a, b){ if(b<0||b>=arr.length) return false; [arr[a],arr[b]]=[arr[b],arr[a]]; return true; }
function focusB(b, select){ const el=$('[data-b="'+b+'"]'); if(el){ el.focus(); if(select && el.select) el.select(); el.scrollIntoView({block:"nearest"}); } }

const ACTIONS = {
  undo(){ undo(); },
  print(){ window.print(); },
  preview(){ UI.preview=true; document.documentElement.classList.add("view-only"); render(); window.scrollTo(0,0); },
  endPreview(){ UI.preview=false; if(!document.documentElement.classList.contains("view-locked") && new URLSearchParams(location.search).get("view")!=="1") document.documentElement.classList.remove("view-only"); render(); },
  opAdd(el){ const st=S.stages.find(s=>s.id===el.dataset.id); if(!st) return; pushUndo();
    const m=el.dataset.method==="mfr"?"mfr":"proto"; const same=st.ops.filter(o=>o.method===m); const last=same[same.length-1];
    const o={id:uid("op"), method:m, name:"", notes:"", freq:last? last.freq : "board", time:null, unknown:false};
    const idx = last? st.ops.indexOf(last)+1 : st.ops.length; st.ops.splice(idx,0,o); commit(); render(); focusB("op|"+st.id+"|"+o.id+"|name"); },
  opUp(el){ const f=findOp(el.dataset.id); if(!f) return; const sib=f.st.ops.filter(o=>o.method===f.o.method); const i=sib.indexOf(f.o); if(i<=0) return; pushUndo(); moveIn(f.st.ops, f.st.ops.indexOf(f.o), f.st.ops.indexOf(sib[i-1])); commit(); render(); },
  opDown(el){ const f=findOp(el.dataset.id); if(!f) return; const sib=f.st.ops.filter(o=>o.method===f.o.method); const i=sib.indexOf(f.o); if(i<0||i>=sib.length-1) return; pushUndo(); moveIn(f.st.ops, f.st.ops.indexOf(f.o), f.st.ops.indexOf(sib[i+1])); commit(); render(); },
  opDup(el){ const f=findOp(el.dataset.id); if(!f) return; pushUndo(); const c=clone(f.o); c.id=uid("op"); f.st.ops.splice(f.st.ops.indexOf(f.o)+1,0,c); commit(); render(); focusB("op|"+f.st.id+"|"+c.id+"|name"); },
  opEx(el){ const f=findOp(el.dataset.id); if(!f) return;
    const opt=(v,l,d)=>`<label class="ex-opt"><input type="radio" name="exOpt" value="${v}"${(f.o.exclude||"")===v?" checked":""}><span><b>${l}</b><br><span class="muted small">${d}</span></span></label>`;
    openModal(`<h3>Count “${esc(trunc(f.o.name||"this step",60))}” in totals?</h3>
      ${opt("","Count everywhere","Included in section totals, the totals table, charts and the cards at the top.")}
      ${opt("headline","Leave out of the top total only","Still counted in the table, totals and charts, but not in the per-board cards at the top of the page.")}
      ${opt("all","Leave out of all totals","The time stays visible in the table but isn't added to any total or chart.")}
      <div class="modal-actions"><button class="btn subtle" data-act="modalClose">Cancel</button><button class="btn primary" data-act="opExSave" data-id="${f.o.id}">Save</button></div>`); },
  opExSave(el){ const f=findOp(el.dataset.id); const r=$('input[name="exOpt"]:checked'); if(!f||!r) return closeModal(); pushUndo(); f.o.exclude=r.value; commit(); closeModal(); render(); },
  opDel(el){ const f=findOp(el.dataset.id); if(!f) return; pushUndo(); f.st.ops.splice(f.st.ops.indexOf(f.o),1); commit(); render(); toast("Step deleted.", "undo"); },
  stAdd(){ pushUndo(); const used=new Set(S.stages.map(s=>s.color)); const st={id:uid("st"), name:"New stage", color:PALETTE.find(c=>!used.has(c))||PALETTE[0], ops:[]}; S.stages.push(st); commit(); render(); focusB("stage|"+st.id+"|name", true); },
  stUp(el){ const i=S.stages.findIndex(s=>s.id===el.dataset.id); if(i<=0) return; pushUndo(); moveIn(S.stages,i,i-1); commit(); render(); },
  stDown(el){ const i=S.stages.findIndex(s=>s.id===el.dataset.id); if(i<0||i>=S.stages.length-1) return; pushUndo(); moveIn(S.stages,i,i+1); commit(); render(); },
  stColor(el){ const st=S.stages.find(s=>s.id===el.dataset.id); if(!st||!PALETTE.includes(el.dataset.color)) return; pushUndo(); st.color=el.dataset.color; commit(); render(); },
  stDel(el){ const st=S.stages.find(s=>s.id===el.dataset.id); if(!st) return;
    const go=()=>{ pushUndo(); S.stages=S.stages.filter(s=>s.id!==st.id); S.improvements.forEach(i=>{ if(i.stageId===st.id) i.stageId=""; }); commit(); closeModal(); render(); toast("Stage deleted.", "undo"); };
    if(st.ops.length) confirmBox("Delete “"+st.name+"”?", `This removes the stage and its ${plural(st.ops.length,"step")}. You can undo this until you leave the page.`, "Delete stage", go); else go(); },
  impAdd(){ pushUndo(); const im={id:uid("im"), stageId:"", text:""}; S.improvements.push(im); commit(); render(); focusB("imp|"+im.id+"|text"); },
  impDel(el){ pushUndo(); S.improvements=S.improvements.filter(i=>i.id!==el.dataset.id); commit(); render(); toast("Suggestion deleted.", "undo"); },
  exportHtml(){ exportHtml(false); }, exportView(){ exportHtml(true); },
  exportJson(){ exportJson(); }, exportCsv(){ exportCsv(); },
  importJson(){ const f=$("#jsonFile"); f.value=""; f.click(); },
  importConfirm(){ if(!PENDING) return closeModal(); pushUndo(); S=PENDING; PENDING=null; commit(); closeModal(); render(); toast("Study imported.", "undo"); },
  resetFile(){ confirmBox("Discard browser edits?", "This reloads the study exactly as it's saved inside this HTML file. Edits made in this browser since the last export are discarded (you can undo until you leave the page).", "Reload file data", ()=>{ pushUndo(); S=clone(FILE_STATE); commit(); closeModal(); render(); toast("Reloaded the file's data.", "undo"); }); },
  useFile(){ pushUndo(); S=clone(FILE_STATE); BANNER={dismissed:true}; commit(); render(); toast("Showing this file's data.", "undo"); },
  restoreDraft(){ if(!BANNER||!BANNER.draft) return; pushUndo(); S=BANNER.draft; BANNER={dismissed:true}; commit(); render(); toast("Browser draft restored.", "undo"); },
  dismissBanner(){ if(BANNER) BANNER.dismissed=true; renderBanner(); },
  modalClose(){ closeModal(); },
  confirmOk(){ const fn=CONFIRM_FN; CONFIRM_FN=null; if(fn) fn(); else closeModal(); }
};
const VIEW_OK = new Set(["print","endPreview","modalClose"]);

document.addEventListener("click", e=>{
  const el=e.target.closest("[data-act]"); if(!el || el.disabled) return;
  const fn=ACTIONS[el.dataset.act]; if(!fn) return;
  if(isView() && !VIEW_OK.has(el.dataset.act)) return;
  e.preventDefault(); fn(el);
});
document.addEventListener("change", e=>{
  const el=e.target;
  if(el.id==="jsonFile"){ importJsonFile(el.files && el.files[0]); return; }
  if(!el.matches || !el.matches("[data-b]") || isView()) return;
  const parts=el.dataset.b.split("|"), k=el.dataset.k;
  let val;
  if(k==="time"){ const r=parseTime(el.value); if(!r.ok){ markBad(el, "Couldn't read “"+el.value+"”. Use m:ss like 2:30, or type Unknown."); return; } val=r; }
  else if(k==="num"){ const r=parseNum(el.value); if(!r.ok){ markBad(el, "Enter a number greater than 0, or leave it blank."); return; } val=r.val; }
  else val=el.value;
  el.classList.remove("bad"); el.removeAttribute("title");
  pushUndo();
  if(!setField(parts, val, k)){ UNDO.pop(); return; }
  commit();
  if(k==="time"){ el.value = val.unknown? "Unknown" : (isNum(val.val)? mss(val.val) : ""); el.classList.toggle("unk", !!val.unknown); }
  if(el.tagName==="SELECT" || (parts[0]==="stage")) render(); else refreshDerived();
});
document.addEventListener("input", e=>{ const el=e.target; if(el.tagName==="TEXTAREA" && el.classList.contains("ci")) autosize(el); if(el.classList && el.classList.contains("bad")) el.classList.remove("bad"); });
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && $("#modal").classList.contains("open")){ closeModal(); return; }
  const el=e.target;
  if(e.key==="Enter" && !e.shiftKey && el.matches && el.matches('input.ci[data-k="time"]')){
    e.preventDefault();
    const all=$$('input.ci[data-k="time"]'), i=all.indexOf(el);
    if(i>=0 && i<all.length-1){ all[i+1].focus(); all[i+1].select(); } else el.blur();
    return;
  }
  if(e.key==="Enter" && !e.shiftKey && el.tagName==="TEXTAREA" && el.classList.contains("ci")){ e.preventDefault(); el.blur(); return; }
  if((e.metaKey||e.ctrlKey) && !e.shiftKey && e.key.toLowerCase()==="z"){
    const tag=(el.tagName||"").toLowerCase(); if(tag==="input"||tag==="textarea"||tag==="select") return;
    e.preventDefault(); undo();
  }
});
document.addEventListener("mousemove", showTip);
document.addEventListener("scroll", ()=>{ $("#tip").style.display="none"; }, true);
$("#modal").addEventListener("mousedown", e=>{ if(e.target.id==="modal") closeModal(); });
let RS_T=null;
window.addEventListener("resize", ()=>{ clearTimeout(RS_T); RS_T=setTimeout(()=>{ drawCharts(); autosizeAll(); }, 150); });
// Print the clean, read-only version of the page
window.addEventListener("beforeprint", ()=>{ if(!UI.printing){ UI.printing=true; render(); } });
window.addEventListener("afterprint", ()=>{ if(UI.printing){ UI.printing=false; render(); } });
window.addEventListener("beforeunload", e=>{ if(isView() || STORAGE_OK) return; if(contentSig(S)!==FILE_SIG){ e.preventDefault(); e.returnValue=""; } });

loadInitial();
render();
</script>
