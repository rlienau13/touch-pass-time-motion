function autoSummary(A){
  if(!A.valid.length) return "No observations have been entered yet, so there is nothing to summarize.";
  const parts = [];
  const dr = A.dates.length? " ("+fmtDate(A.dates[0])+(A.dates[A.dates.length-1]!==A.dates[0]? " – "+fmtDate(A.dates[A.dates.length-1]) : "")+")" : "";
  parts.push(`Across ${plural(A.valid.length,"observation")} of ${plural(A.boards.length,"board")}${dr}, ${fmtH(A.tot.handsPM)} of hands-on labor was recorded.`);
  if(isNum(A.stdPerBoard)) parts.push(`Built from operation averages, one board takes an estimated ${fmtD(A.stdPerBoard)} of hands-on labor${A.noData.length? ", excluding "+A.noData.length+" operation"+(A.noData.length>1?"s":"")+" with no data ("+A.noData.map(s=>s.op.name).join(", ")+")" : ""}.`);
  if(isNum(A.avgBoardLabor)) parts.push(`The ${plural(A.completeBoards,"fully recorded board")} averaged ${fmtD(A.avgBoardLabor)}.`);
  const top = A.withData.slice().sort((a,b)=>b.handsMean-a.handsMean).slice(0,3);
  if(top.length) parts.push(`${top[0].op.name} accounts for the largest share of labor (${pct(top[0].share)})${top.length>1? ", followed by "+top.slice(1).map(s=>s.op.name+" ("+pct(s.share)+")").join(" and ") : ""}.`);
  if(A.topStation) parts.push(`The longest station time per board is ${A.topStation.op.name} at ${fmtD(A.topStation.station)}${A.topStation.stationBasis==="elapsed"?"":" (estimated)"}, making it the most likely capacity constraint.`);
  const bits=[];
  if(A.tot.reworkClock>0) bits.push(`rework totalled ${fmtH(A.tot.reworkClock)} (${pct(A.tot.reworkPM/A.tot.handsPM,1)} of hands-on labor)`);
  if(A.tot.wait>0) bits.push(`waiting totalled ${fmtH(A.tot.wait)}`);
  if(A.tot.setupClock>0) bits.push(`setup totalled ${fmtH(A.tot.setupClock)}`);
  if(bits.length) parts.push(bits.join(", ").replace(/^./, c=>c.toUpperCase())+".");
  if(A.highVar.length) parts.push(`Variation is highest in ${A.highVar.slice(0,2).map(s=>s.op.name+" (CV "+pct(s.cv)+", n="+s.nLabor+")").join(" and ")}, so ${A.highVar.length>1?"those operations aren't":"that operation isn't"} yet repeatable.`);
  else if(A.withData.some(s=>isNum(s.cv))) parts.push("No operation shows a coefficient of variation above 30%.");
  return parts.join(" ");
}
function evidence(key, A){
  const li = arr=> arr.length? `<ul>${arr.map(x=>`<li>${x}</li>`).join("")}</ul>` : `<div class="muted">Not enough data yet.</div>`;
  if(key==="bottlenecks"){
    const top = A.withData.slice().sort((a,b)=>b.handsMean-a.handsMean).slice(0,3).map(s=>`<b>${esc(s.op.name)}</b> — ${esc(fmtD(s.handsMean))} labor / board (${pct(s.share)})`);
    const stn = A.opStats.filter(s=>isNum(s.station)).sort((a,b)=>b.station-a.station).slice(0,2).map(s=>`Station: <b>${esc(s.op.name)}</b> — ${esc(fmtD(s.station))} / board${s.stationBasis==="estimated"?" (est.)":""}`);
    return li(top.concat(stn));
  }
  if(key==="inefficiencies"){
    const out=[];
    if(A.tot.handsPM>0){ out.push(`Rework: ${esc(fmtH(A.tot.reworkClock))} · ${pct(A.tot.reworkPM/A.tot.handsPM,1)} of hands-on labor`); out.push(`Setup: ${esc(fmtH(A.tot.setupClock))} · ${pct(A.tot.setupPM/A.tot.handsPM,1)} of hands-on labor`); }
    if(A.tot.wait>0) out.push(`Waiting: ${esc(fmtH(A.tot.wait))} recorded`);
    const by = motionByOp(); let nva=0, tot=0, steps=0; by.forEach(x=>{ nva+=x.total-x.va; tot+=x.total; steps+=x.nva; });
    if(steps) out.push(`${steps} non-value-adding motion steps${tot>0? " · "+pct(nva/tot)+" of timed motion":""}`);
    const rw = A.opStats.filter(s=>s.reworkPUMean>0).sort((a,b)=>b.reworkPUMean-a.reworkPUMean)[0];
    if(rw) out.push(`Most rework: <b>${esc(rw.op.name)}</b> (${esc(fmtD(rw.reworkPUMean))} / board)`);
    return li(out);
  }
  if(key==="improvements"){
    const open = S.improvements.filter(i=>["idea","planned","testing"].includes(i.status));
    const out = open.slice().sort((a,b)=>(b.savings||0)-(a.savings||0)).slice(0,4).map(i=>`${esc(i.proposal||i.problem||"Untitled")}${(A.opsById[i.opId]||{}).name? " — "+esc(A.opsById[i.opId].name):""}${isNum(i.savings)? " · est. "+esc(fmtD(i.savings))+"/board "+tagP():""}`);
    const est = sum(open.map(i=>i.savings));
    if(est>0) out.push(`Total estimated: ${esc(fmtD(est))} / board ${tagP()}`);
    return li(out);
  }
  if(key==="manufacturability"){
    const out = A.highVar.slice(0,3).map(s=>`High variation: <b>${esc(s.op.name)}</b> (CV ${pct(s.cv)})`);
    const outs = S.operations.filter(o=>o.sourcing==="outsourced"); if(outs.length) out.push(`Outsourced: ${outs.map(o=>esc(o.name)).join(", ")}`);
    const tbd = S.operations.filter(o=>o.sourcing==="tbd"); if(tbd.length) out.push(`Sourcing undecided: ${tbd.map(o=>esc(o.name)).join(", ")}`);
    const hi = S.motions.filter(m=>m.effort==="High"); if(hi.length) out.push(`${plural(hi.length,"high-effort motion step")}`);
    return li(out);
  }
  if(key==="nextSteps"){
    const out = [];
    if(A.noData.length) out.push(`Record: ${A.noData.map(s=>esc(s.op.name)).join(", ")}`);
    const low = A.withData.filter(s=>s.nLabor<3); if(low.length) out.push(`More observations (n&lt;3): ${low.map(s=>esc(s.op.name)).join(", ")}`);
    const noEl = A.opStats.filter(s=>s.n && !s.nElapsed); if(noEl.length) out.push(`Add elapsed time: ${noEl.map(s=>esc(s.op.name)).join(", ")}`);
    const testing = S.improvements.filter(i=>i.status==="testing"); if(testing.length) out.push(`Re-measure ${plural(testing.length,"implemented change")}`);
    const quotes = []; S.scenarios.forEach(sc=>S.operations.forEach(op=>{ const c=scenOp(sc,op); if(c.mode==="outsourced" && !isNum(c.outCost) && !quotes.includes(op.name)) quotes.push(op.name); }));
    if(quotes.length) out.push(`Get partner quotes: ${quotes.map(esc).join(", ")}`);
    return li(out);
  }
  return "";
}

let FILE_STATE=null, FILE_SIG="", STORAGE_OK=false, LAST_SAVE=0, BANNER=null, EMBED_ERR=false;

function testStorage(){ try{ const k="__tms_test"; localStorage.setItem(k,"1"); localStorage.removeItem(k); return true; }catch(e){ return false; } }
function loadInitial(){
  let embedded = null;

  STORAGE_OK = testStorage();
  let draft = null;
  if(STORAGE_OK){
    try{ const raw = localStorage.getItem(DRAFT_KEY); if(raw){ const d = JSON.parse(raw); draft = {savedAt:Number(d.savedAt)||0, data:normalizeState(d.data)}; } }catch(e){ console.warn("Ignoring unreadable browser draft", e); }
  }
  if(draft && contentSig(draft.data)!==FILE_SIG){
    const fileT = FILE_STATE.meta.updatedAt||0, draftT = draft.data.meta.updatedAt||draft.savedAt||0;
    if(draftT >= fileT){ S = draft.data; BANNER = {kind:"draft", t:draftT}; }

  } else S = clone(FILE_STATE);

}

  if(isView()) return;

function download(content, name, type){
  const blob = new Blob([content], {type});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function safeJson(o, pretty){ return JSON.stringify(o, null, pretty?2:0).replace(/</g,"\\u003c").replace(/\u2028/g,"\\u2028").replace(/\u2029/g,"\\u2029"); }
function buildExportHtml(viewLock){
  const doc = document.documentElement.cloneNode(true);

  $$("[data-clear]", doc).forEach(el=>{ el.innerHTML=""; });

  let html = "<!DOCTYPE html>\n"+doc.outerHTML;
  html = html.replace(/\/\*VIEW_LOCK\*\/(?:true|false)\/\*VIEW_LOCK_END\*\//, "/*VIEW_"+"LOCK*/"+(viewLock?"true":"false")+"/*VIEW_LOCK_"+"END*/");
  return html;
}

function parseDelimited(text){
  const delim = text.includes("\t") ? "\t" : ",";
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; continue; }
    if(c==='"' && cell===""){ q=true; continue; }
    if(c===delim){ row.push(cell); cell=""; continue; }
    if(c==="\n" || c==="\r"){ if(c==="\r" && text[i+1]==="\n") i++; row.push(cell); rows.push(row); row=[]; cell=""; continue; }
    cell+=c;
  }
  if(cell!=="" || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}
function parseDateLoose(s){
  s=String(s||"").trim(); if(!s) return {ok:true, val:""};
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return {ok:true, val:s};
  const m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
  if(m){ let y=+m[3]; if(y<100) y+=2000; const mo=+m[1], d=+m[2]; if(mo>=1&&mo<=12&&d>=1&&d<=31) return {ok:true, val:y+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0")}; }
  const t = Date.parse(s); if(!isNaN(t)){ const d=new Date(t); return {ok:true, val:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}; }
  return {ok:false};
}
function matchOp(s){
  const v = String(s||"").trim().toLowerCase(); if(!v) return null;
  return S.operations.find(o=>o.code.toLowerCase()===v) || S.operations.find(o=>o.name.toLowerCase()===v)
    || S.operations.find(o=>o.name.toLowerCase().startsWith(v)) || S.operations.find(o=>o.name.toLowerCase().includes(v)) || null;
}
function analyzePaste(text, createOps){
  const rows = parseDelimited(text||"");
  if(!rows.length) return {rows:[], map:[], header:false};
  const norm = c=> String(c||"").trim().toLowerCase().replace(/\s*\((?:min|mins|minutes|m:ss|people)\)\s*$/,"").replace(/\s+/g," ");
  const first = rows[0].map(norm);
  const hits = first.map(c=>{ const f=PASTE_COLS.find(pc=>pc[1].includes(c)); return f? f[0] : null; });
  const header = hits.filter(Boolean).length>=2;
  const map = header ? hits : PASTE_COLS.map(c=>c[0]);
  const body = header ? rows.slice(1) : rows;
  const newOps = new Map();
  const out = body.map((r,ri)=>{
    const rec = {date:"", board:"", batch:"", opName:"", opId:"", units:1, labor:null, machine:null, wait:null, setup:null, rework:null, elapsed:null, operators:1, notes:"", errors:[]};
    map.forEach((k,ci)=>{
      if(!k) return; const raw = r[ci]==null? "" : String(r[ci]).trim();
      if(k==="date"){ const d=parseDateLoose(raw); if(d.ok) rec.date=d.val; else rec.errors.push("date “"+raw+"”"); }
      else if(k==="board"||k==="batch"||k==="notes") rec[k]=raw.slice(0,k==="notes"?1000:60);
      else if(k==="op"){ rec.opName=raw; const op=matchOp(raw); if(op) rec.opId=op.id; }
      else if(k==="units"||k==="operators"){ if(raw){ const n=parseNum(raw,"int"); if(n.ok) rec[k]=n.val; else rec.errors.push(PASTE_LABEL[k].toLowerCase()+" “"+raw+"”"); } }
      else { const t=parseTime(raw); if(t.ok) rec[k]=t.val; else rec.errors.push(PASTE_LABEL[k].toLowerCase()+" “"+raw+"”"); }
    });
    if(!rec.opId){
      if(rec.opName && createOps){ const key=rec.opName.toLowerCase(); if(!newOps.has(key)) newOps.set(key, rec.opName); rec.newOp=key; }
      else rec.errors.push(rec.opName? "unknown operation “"+rec.opName+"”" : "no operation");
    }
    return rec;
  });
  return {rows:out, map, header, newOps};
}

let TOAST_T = null;

function showTip(e){
  const t = e.target.closest && e.target.closest("[data-tip]");
  const tip = $("#tip");
  if(!t || !t.getAttribute("data-tip")){ tip.style.display="none"; return; }
  tip.textContent = t.getAttribute("data-tip");
  tip.style.display = "block";

function setField(coll, id, field, val){
  if(coll==="settings"){ if(field==="timeFormat") val = val==="mss"?"mss":"dec"; S.settings[field]=val; return true; }
  if(coll==="find"){ S.findings[field]=String(val||""); return true; }
  if(coll==="meta"){ if(field==="linkRoadmap"||field==="linkBom"){ S.meta[field]=safeUrl(val); return true; } S.meta[field]=String(val||"").slice(0,300); return true; }
  if(coll==="scop"){
    const [sid, oid] = id.split("~"); const sc = S.scenarios.find(s=>s.id===sid); if(!sc) return false;
    sc.ops[oid] = sc.ops[oid] || {};
    if(field==="stations" && val!=null) val = Math.max(1, Math.round(val));
    if(val==null || val==="") delete sc.ops[oid][field]; else sc.ops[oid][field]=val;
    return true;
  }
  const T = {obs:S.observations, op:S.operations, stage:S.stages, mot:S.motions, imp:S.improvements, scen:S.scenarios};
  const obj = (T[coll]||[]).find(x=>x.id===id); if(!obj) return false;
  if(coll==="obs" && (field==="units"||field==="operators") && val==null) val=1;
  if(coll==="mot" && field==="reps" && val==null) val=1;
  if(coll==="scen"){
    if(field==="productivePct"){ if(!val) val=85; val=Math.min(100, val); }
    if(field==="hoursPerDay"){ if(!val) val=8; val=Math.min(24, val); }
    if(field==="operators" && val==null) val=1;
    if(field==="name") val = String(val).trim().slice(0,80) || "Scenario";
  }
  if(coll==="op" && field==="name") val = String(val).trim().slice(0,120) || "Untitled operation";
  if(coll==="stage" && field==="name") val = String(val).trim().slice(0,80) || "Stage";
  obj[field] = val;
  return true;
}

function newObsFromLast(){
  const o = blankObs(), last = S.observations[S.observations.length-1];
  if(last){
    Object.assign(o, {date:last.date, board:last.board, batch:last.batch, units:last.units, operators:last.operators});
    const i = S.operations.findIndex(x=>x.id===last.opId);
    o.opId = (i>=0 && i<S.operations.length-1) ? S.operations[i+1].id : (S.operations[0]? S.operations[0].id : "");
  } else o.opId = S.operations[0]? S.operations[0].id : "";
  if(UI.fOp) o.opId = UI.fOp;
  if(UI.fBoard){ const ex = S.observations.find(x=>boardKey(x.board)===UI.fBoard); if(ex) o.board = ex.board; }
  return o;
}
function focusB(b){ setTimeout(()=>{ const el=$('[data-b="'+b+'"]'); if(el){ el.focus(); el.scrollIntoView({block:"nearest"}); } }, 20); }
function moveIn(arr, id, dir){ const i=arr.findIndex(x=>x.id===id), j=i+dir; if(i<0||j<0||j>=arr.length) return false; [arr[i],arr[j]]=[arr[j],arr[i]]; return true; }
function dupIn(arr, id, prefix, tweak){ const i=arr.findIndex(x=>x.id===id); if(i<0) return null; const c=clone(arr[i]); c.id=uid(prefix); if(tweak) tweak(c); arr.splice(i+1,0,c); return c; }
function removeOp(id){
  S.operations = S.operations.filter(o=>o.id!==id);
  S.observations.forEach(o=>{ if(o.opId===id) o.opId=""; });
  S.motions.forEach(o=>{ if(o.opId===id) o.opId=""; });
  S.improvements.forEach(o=>{ if(o.opId===id) o.opId=""; });
  S.scenarios.forEach(sc=>{ delete sc.ops[id]; });
}
function nextOpCode(){
  const nums = S.operations.map(o=>{ const m=String(o.code).match(/(\d+)\s*$/); return m? +m[1] : 0; });
  return "OP-"+((Math.floor(Math.max(0,...nums)/10)+1)*10);
}

  motAdd(){ pushUndo(); const last=S.motions[S.motions.length-1]; const m={id:uid("mo"), opId: UI.motOp || (last? last.opId : (S.operations[0]||{}).id||""), desc:"", duration:null, reps:1, cls:"va", tools:"", effort:"", inefficiency:"", notes:""};
    // keep a new step next to its operation's other steps
    const idx = S.motions.map(x=>x.opId).lastIndexOf(m.opId); if(idx>=0) S.motions.splice(idx+1,0,m); else S.motions.push(m);
    commit(); render(); focusB("mot|"+m.id+"|desc"); },
  motUp(el){ const m=S.motions.find(x=>x.id===el.dataset.id); if(!m) return; const sib=S.motions.filter(x=>x.opId===m.opId); const i=sib.indexOf(m); if(i<=0) return; pushUndo(); const a=S.motions.indexOf(m), b=S.motions.indexOf(sib[i-1]); [S.motions[a],S.motions[b]]=[S.motions[b],S.motions[a]]; commit(); render(); },
  motDown(el){ const m=S.motions.find(x=>x.id===el.dataset.id); if(!m) return; const sib=S.motions.filter(x=>x.opId===m.opId); const i=sib.indexOf(m); if(i<0||i>=sib.length-1) return; pushUndo(); const a=S.motions.indexOf(m), b=S.motions.indexOf(sib[i+1]); [S.motions[a],S.motions[b]]=[S.motions[b],S.motions[a]]; commit(); render(); },
  motDup(el){ pushUndo(); const c=dupIn(S.motions, el.dataset.id, "mo"); commit(); render(); if(c) focusB("mot|"+c.id+"|desc"); },
  motDel(el){ pushUndo(); S.motions=S.motions.filter(x=>x.id!==el.dataset.id); commit(); render(); toast("Motion step deleted.", "undo"); },
  // improvements
  impAdd(){ pushUndo(); const im={id:uid("im"), opId:"", problem:"", proposal:"", benefit:"", savings:null, difficulty:"", priority:"", status:"idea", measured:null, notes:""}; S.improvements.push(im); commit(); render(); focusB("imp|"+im.id+"|problem"); },
  impDup(el){ pushUndo(); dupIn(S.improvements, el.dataset.id, "im"); commit(); render(); },
  impDel(el){ pushUndo(); S.improvements=S.improvements.filter(x=>x.id!==el.dataset.id); commit(); render(); toast("Improvement deleted.", "undo"); },
  // production
  qty(el){ const v=posInt(el.dataset.v, 100); if(!isView()) pushUndo(); S.production.qty=v; if(!isView()) commit(); render(); },
  scTab(el){ UI.scenTab = el.dataset.id; render(); },
  scAdd(){ if(S.scenarios.length>=4) return; pushUndo(); const sc=makeScenario(uid("sc"), "Scenario "+(S.scenarios.length+1), ""); S.scenarios.push(sc); UI.scenTab=sc.id; commit(); render(); },
  scDup(el){ if(S.scenarios.length>=4) return; pushUndo(); const c=dupIn(S.scenarios, el.dataset.id, "sc", c=>{ c.name=c.name+" (copy)"; }); if(c) UI.scenTab=c.id; commit(); render(); },
  scDel(el){ if(S.scenarios.length<=1) return; const sc=S.scenarios.find(s=>s.id===el.dataset.id); if(!sc) return;
    confirmBox("Delete scenario “"+sc.name+"”?", "Its assumptions and per-operation settings will be removed.", "Delete scenario", ()=>{ pushUndo(); S.scenarios=S.scenarios.filter(s=>s.id!==sc.id); commit(); closeModal(); render(); toast("Scenario deleted.", "undo"); }); },
  // publishing & data
  exportHtml(){ exportHtml(false); },
  exportView(){ exportHtml(true); },
  exportJson(){ exportJson(); },
  importJson(){ const f=$("#jsonFile"); if(f){ f.value=""; f.click(); } },
  importConfirm(){ if(!PENDING_IMPORT) return closeModal(); pushUndo(); S = PENDING_IMPORT; PENDING_IMPORT=null; commit(); closeModal(); UI.sortOrder=null; UI.sortCol=null; render(); toast("Study imported.", "undo"); },
  resetFile(){ confirmBox("Discard browser edits?", "This reloads the study exactly as it's saved inside this HTML file. Edits made in this browser since the last export are discarded (you can undo until you leave the page).", "Reload file data", ()=>{ pushUndo(); S=clone(FILE_STATE); commit(); closeModal(); render(); toast("Reloaded the file's data.", "undo"); }); },
  blank(){ confirmBox("Start a blank study?", "All observations, motion steps, improvements, scenario settings and findings will be removed, and the suggested workflow restored. Export a JSON backup first if you might need them.", "Start blank", ()=>{ pushUndo(); const t=makeTemplate(); t.meta.preparedBy=S.meta.preparedBy; S=t; commit(); closeModal(); render(); toast("Blank study started.", "undo"); }); },
  useFile(){ pushUndo(); S=clone(FILE_STATE); BANNER={dismissed:true}; commit(); render(); toast("Showing this file's data.", "undo"); },
  restoreDraft(){ if(!BANNER || !BANNER.draft) return; pushUndo(); S=BANNER.draft; BANNER={dismissed:true}; commit(); render(); toast("Browser draft restored.", "undo"); },
  dismissBanner(){ if(BANNER) BANNER.dismissed=true; renderBanner(); },
  modalClose(){ closeModal(); },
  confirmOk(){ const fn=CONFIRM_FN; CONFIRM_FN=null; if(fn) fn(); else closeModal(); }
};
const VIEW_OK = new Set(["fmt","tab","print","sort","clearSort","qty","scTab","endPreview","modalClose"]);

/* =====================================================================
   Events
   ===================================================================== */
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act, fn = ACTIONS[act]; if(!fn) return;
  if(isView() && !VIEW_OK.has(act)) return;
  if(el.disabled) return;
  e.preventDefault();
  fn(el);
});
document.addEventListener("change", e=>{
  const el = e.target;
  if(el.id==="jsonFile"){ importJsonFile(el.files && el.files[0]); return; }
  if(el.id==="obsFOp"){ UI.fOp=el.value; render(); return; }
  if(el.id==="obsFBoard"){ UI.fBoard=el.value; render(); return; }
  if(el.id==="obsGroup"){ UI.group=el.value; render(); return; }
  if(el.id==="motFOp"){ UI.motOp=el.value; render(); return; }
  if(el.id==="pasteCreate"){ updatePastePreview(); return; }
  if(el.id==="qtyCustom"){
    const r=parseNum(el.value,"int");
    if(!r.ok || r.val==null || r.val>1000000){ if(el.value.trim()) markBad(el, "Enter a whole number of boards (1 or more)."); return; }
    if(!isView()) pushUndo(); S.production.qty=r.val; if(!isView()) commit(); render(); return;
  }
  if(!el.matches || !el.matches("[data-b]") || isView()) return;
  const [coll, id, field] = el.dataset.b.split("|");
  const k = el.dataset.k;
  let val;
  if(k==="time"){ const r=parseTime(el.value); if(!r.ok){ markBad(el, "Couldn't read “"+el.value+"”. Use 4.5, 4:30, 1:05:30 or 4m 30s."); return; } val=r.val; }
  else if(k==="num" || k==="int"){ const r=parseNum(el.value, k); if(!r.ok){ markBad(el, k==="int"? "Enter a whole number, 1 or more." : "Enter a number, 0 or more."); return; } val=r.val; }
  else if(k==="bool") val = el.checked;
  else if(k==="date") val = /^\d{4}-\d{2}-\d{2}$/.test(el.value)? el.value : "";
  else val = String(el.value).slice(0, MAX_TEXT);
  if(coll==="meta" && /^link/.test(field) && String(val).trim() && !safeUrl(val)){ markBad(el, "Paste a full web address starting with https://"); return; }
  clearBad(el);
  pushUndo();
  if(!setField(coll, id, field, val)){ UNDO.pop(); return; }
  commit();
  if(k==="time") el.value = fmtT(val);
  if(el.tagName==="SELECT" || k==="bool") render(); else refreshDerived();
});
document.addEventListener("input", e=>{
  const el = e.target;
  if(el.id==="obsSearch"){ UI.q = el.value; render(); }
  if(el.id==="pasteText"){ updatePastePreview(); }
  if(el.classList && el.classList.contains("bad")){ el.classList.remove("bad"); }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && $("#modal").classList.contains("open")){ closeModal(); return; }
  const el = e.target;
  // Spreadsheet-style: Enter moves to the same column in the next row
  if(e.key==="Enter" && !e.shiftKey && el.matches && el.matches("table.grid input.ci, table.grid select.ci")){
    const td = el.closest("td"), tr = el.closest("tr"); if(!td||!tr) return;
    const ci = Array.from(tr.children).indexOf(td);
    let nx = tr.nextElementSibling;
    while(nx && !(nx.children[ci] && nx.children[ci].querySelector(".ci"))) nx = nx.nextElementSibling;
    e.preventDefault();
    if(nx){ const t=nx.children[ci].querySelector(".ci"); t.focus(); if(t.select) t.select(); }
    else el.blur();
    return;
  }
  if((e.metaKey||e.ctrlKey) && !e.shiftKey && e.key.toLowerCase()==="z"){
    const tag = (el.tagName||"").toLowerCase();
    if(tag==="input"||tag==="textarea"||tag==="select") return;
    e.preventDefault(); undo();
  }
});
document.addEventListener("mousemove", showTip);
document.addEventListener("scroll", ()=>{ $("#tip").style.display="none"; }, true);
$("#modal").addEventListener("mousedown", e=>{ if(e.target.id==="modal") closeModal(); });
let RS_T=null;
window.addEventListener("resize", ()=>{ clearTimeout(RS_T); RS_T=setTimeout(()=>drawCharts($("#panel")), 150); });
window.addEventListener("hashchange", ()=>{ const h=(location.hash||"").replace("#",""); if(TABS.some(t=>t[0]===h) && h!==UI.tab){ UI.tab=h; render(); window.scrollTo(0,0); } });
window.addEventListener("beforeprint", ()=>{ if(UI.tab!=="report"){ UI.tab="report"; render(); } });
window.addEventListener("beforeunload", e=>{
  if(isView() || STORAGE_OK) return;
  if(contentSig(S)!==FILE_SIG){ e.preventDefault(); e.returnValue=""; }
});

/* ---------- init ---------- */
function init(){
  loadInitial();
  const h = (location.hash||"").replace("#","");
  if(TABS.some(t=>t[0]===h)) UI.tab = h;
  else if(!isView() && !S.observations.length) UI.tab = "time";
  render();
}
init();
</script>
